    const params = new URLSearchParams(window.location.search);
    let count = parseInt(params.get("count"), 10);
    if (isNaN(count) || count < 1) count = allQuestions.length;
    if (count > allQuestions.length) count = allQuestions.length;

    function shuffle(arr) {
      const c = [...arr];
      for (let i = c.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [c[i], c[j]] = [c[j], c[i]];
      }
      return c;
    }
    const selected = shuffle(allQuestions).slice(0, count);

    const area = document.getElementById("questionsArea");
    let score = 0;
    let answered = 0;

    document.getElementById("total").textContent = count;

    selected.forEach((q, i) => {
      const block = document.createElement("div");
      block.className = "question-block";

      block.innerHTML = `
        <p class="question-text"><strong>Question ${i + 1}:</strong> ${q.text}</p>
        <div class="options">
          ${q.options.map((opt, optIdx) => `
            <button class="option" data-q="${i}" data-opt="${optIdx}">${opt}</button>
          `).join("")}
        </div>
      `;

      area.appendChild(block);
    });

    area.addEventListener("click", (e) => {
      const btn = e.target.closest(".option");
      if (!btn) return;

      const qIndex = parseInt(btn.dataset.q, 10);
      const optIndex = parseInt(btn.dataset.opt, 10);
      const question = selected[qIndex];

      const block = btn.closest(".question-block");
      if (block.classList.contains("answered")) return;
      block.classList.add("answered");

      const buttons = block.querySelectorAll(".option");
      buttons[question.correct].classList.add("correct");

      if (optIndex !== question.correct) {
        btn.classList.add("wrong");
      } else {
        score++;
      }

      answered++;
      buttons.forEach(b => b.disabled = true);
      document.getElementById("score").textContent = score;

      if (answered === count) {
        showFinalResult();
      }
    });

    function showFinalResult() {
      const box = document.getElementById("finalResult");
      const pct = Math.round((score / count) * 100);
      box.innerHTML = `
        <i class="fas fa-trophy"></i>
        Your final score: <strong>${score} / ${count}</strong> (${pct}%)
      `;
      box.classList.add("visible");
      box.scrollIntoView({ behavior: "smooth", block: "center" });
    }

    // ============ CUSTOM CONFIRM ============
const modal = document.getElementById("confirmModal");
const modalMsg = document.getElementById("confirmMessage");
const confirmYes = document.getElementById("confirmYes");
const confirmNo = document.getElementById("confirmNo");

function showConfirm(message, onYes) {
  modalMsg.textContent = message;
  modal.classList.add("visible");

  // Remove old listeners
  const newYes = confirmYes.cloneNode(true);
  const newNo = confirmNo.cloneNode(true);
  confirmYes.parentNode.replaceChild(newYes, confirmYes);
  confirmNo.parentNode.replaceChild(newNo, confirmNo);

  newYes.addEventListener("click", () => {
    modal.classList.remove("visible");
    onYes();
  });

  newNo.addEventListener("click", () => {
    modal.classList.remove("visible");
  });
}

// ============ SUBMIT BUTTON ============
document.getElementById("submitBtn").addEventListener("click", () => {
  if (answered < count) {
    showConfirm(
      `You answered ${answered} of ${count} questions. Do you want to end the test?`,
      showFinalResult
    );
  } else {
    showFinalResult();
  }
});

    const scrollBtn = document.getElementById("scrollTopBtn");

    window.addEventListener("scroll", () => {
      if (window.scrollY > 300) {
        scrollBtn.classList.add("visible");
      } else {
        scrollBtn.classList.remove("visible");
      }
    });

    scrollBtn.addEventListener("click", () => {
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
