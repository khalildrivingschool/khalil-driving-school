{text: "En approchant d'une intersection sans feux de signalisation, vous devez :", options: ["Continuer à vitesse normale", "Ralentir et céder le passage à la circulation venant de la droite", "Garder les feux de route allumés en permanence"], correct: 1},
{text: "Lorsqu'un passager demande à s'arrêter pour descendre, en tant que chauffeur de taxi, vous devez vous arrêter :", options: ["Uniquement dans les endroits où l'arrêt est autorisé", "N'importe où le passager le souhaite en dehors des villes", "Dans les endroits désignés à l'intérieur des villes"], correct: 0},
{text: "Quel est le but de la ceinture de sécurité ?", options: ["Décorer la voiture uniquement", "Protéger le conducteur et les passagers en cas d'accident", "Elle n'a aucune utilité à basse vitesse"], correct: 1},
{text: "Si le feu de signalisation passe au rouge, que faites-vous ?", options: ["Vous continuez rapidement", "Vous vous arrêtez avant la ligne d'arrêt et le passage piéton et attendez le feu vert", "Vous vous arrêtez juste avant le passage piéton"], correct: 1},
{text: "En cas d'arrêt d'urgence ou de panne :", options: ["Le conducteur doit allumer les feux de détresse", "Lors de la conduite en ville le jour", "Lors du dépassement sur l'autoroute"], correct: 0},
{text: "Les bagages des passagers doivent être chargés :", options: ["Sur les genoux du passager", "Dans le coffre du véhicule", "N'importe où dans l'habitacle ou le coffre"], correct: 1},
{text: "Lorsque vous vous arrêtez pour faire monter des passagers, l'arrêt doit être :", options: ["Dans les parkings et les endroits désignés", "N'importe où le passager le demande, même au milieu de la route", "Aux virages et aux intersections"], correct: 0},
{text: "Si le passager transporte des bagages volumineux, il faut :", options: ["Les charger de manière à ne pas gêner le mouvement des portes et la visibilité", "Les placer sur les sièges réservés aux passagers", "Les charger même s'ils empêchent la fermeture des portes"], correct: 0},
{text: "Quel est le comportement correct lorsqu'on reçoit le tarif du passager en conduisant ?", options: ["Se concentrer sur le comptage de l'argent en roulant", "Recevoir le tarif après s'être arrêté en toute sécurité", "Rendre la monnaie en conduisant rapidement"], correct: 1},
{text: "Quel est le comportement correct d'un chauffeur de taxi envers les passagers en cas de conflit avec eux ?", options: ["Faire preuve de politesse et de bon traitement pour réduire la tension", "Les traiter durement et avec une voix forte pour affirmer sa position", "Ignorer les plaintes des passagers et laisser place au dialogue"], correct: 0},
{text: "Il est permis d'occuper la voiture avec un nombre de passagers dépassant le nombre de sièges :", options: ["Uniquement selon le nombre de sièges autorisé", "Debout s'il n'y a pas assez de sièges", "En considérant que deux sièges sont désignés pour trois passagers"], correct: 0},
{text: "L'arrêt pour faire monter des passagers se fait :", options: ["Dans les endroits désignés à cet effet", "À l'endroit demandé par le passager", "À l'endroit qui convient au véhicule"], correct: 0},
{text: "Les bagages volumineux transportés par le passager sont chargés :", options: ["De manière à ne pas gêner le mouvement des portes et la visibilité", "Dans les 15 cm à l'extérieur des portes", "Dans les 30 cm à l'extérieur des portes"], correct: 0},
{text: "Le tarif est perçu auprès du client :", options: ["Pendant la conduite avec comptage", "Après l'arrêt ou en toute sécurité", "Il est perçu pendant que vous conduisez rapidement"], correct: 1},
{text: "Lorsqu'un passager monte avec une petite bouteille de gaz :", options: ["Elle est autorisée si elle est hermétiquement fermée", "Son transport est strictement interdit", "Il est permis de la transporter si les autres passagers sont d'accord"], correct: 1},
{text: "Les routes au Liban sont classées en :", options: ["Trois catégories : internationales, principales et locales", "Quatre catégories : internationales, autoroutes, principales et locales", "Cinq catégories : internationales, autoroutes, principales, locales et secondaires"], correct: 0},
{text: "L'enregistrement des conducteurs de véhicules publics à la Caisse Nationale de Sécurité Sociale est divisé en :", options: ["Deux catégories : conducteur propriétaire et conducteur non propriétaire", "Deux catégories : conducteur libanais et conducteur étranger", "Deux catégories : conducteur privé et conducteur public"], correct: 0},
{text: "L'État contribue aux cotisations de la Caisse Nationale de Sécurité Sociale :", options: ["Pour le conducteur invalide", "Pour le conducteur propriétaire", "Pour le conducteur non propriétaire"], correct: 1},
{text: "L'inscription à la Caisse Nationale de Sécurité Sociale se fait :", options: ["Après avoir soumis une demande d'affiliation et son acceptation", "Immédiatement lors de l'achat d'une plaque et sans demande", "Après un an d'achat de la plaque"], correct: 0},
{text: "Le conducteur salarié d'une institution ou d'une entreprise doit déclarer l'impôt sur le revenu et payer les cotisations de la Caisse Nationale de Sécurité Sociale :", options: ["Directement", "Par l'intermédiaire de son employeur", "Par un cabinet comptable"], correct: 1},
{text: "Le conducteur salarié de manière indépendante doit déclarer l'impôt sur le revenu et payer les cotisations de la Caisse Nationale de Sécurité Sociale :", options: ["Directement", "Par l'intermédiaire de son employeur", "Par un cabinet comptable"], correct: 0},
{text: "Le retard dans le paiement des cotisations à la Caisse Nationale de Sécurité Sociale entraîne :", options: ["La suspension de l'utilisation des prestations de sécurité sociale", "Le paiement d'une amende de retard", "Tout ce qui précède"], correct: 0},
{text: "Le retard dans le renouvellement de la validité du permis de conduire des conducteurs publics bénéficiant de la Caisse Nationale de Sécurité Sociale entraîne :", options: ["La suspension de l'utilisation des prestations de sécurité sociale", "Le paiement d'une amende de retard", "Tout ce qui précède"], correct: 0},
{text: "La cotisation de la Caisse Nationale de Sécurité Sociale pour les conducteurs publics après l'âge de 64 ans est divisée en branches :", options: ["Maladie, maternité et fin de service", "Maladie, maternité et allocations familiales", "Fin de service et allocations familiales"], correct: 1},
{text: "L'obtention d'un permis de conduire public est autorisée après avoir vérifié que le casier judiciaire du demandeur est exempt de :", options: ["Condamnations liées à la drogue", "Condamnations préventives non liées à la drogue", "Tout ce qui précède"], correct: 2},
{text: "Le conducteur public doit porter une « licence de transport » :", options: ["Pour tous les types de véhicules", "Pour les véhicules de transport privé transportant des marchandises", "Pour les véhicules publics transportant des marchandises"], correct: 1},
{text: "Les véhicules publics sont autorisés à transporter des passagers depuis l'aéroport international Rafic Hariri :", options: ["Si le véhicule est autorisé à cet effet", "Si le conducteur détient un permis de conduire de catégorie « Bus 1 »", "Tout ce qui précède"], correct: 0},
{text: "Les licences de transport pour les véhicules de transport de marchandises sont renouvelées :", options: ["Tous les cinq ans", "Annuellement", "Tous les six mois"], correct: 1},
{text: "Le conducteur d'un véhicule touristique public doit connaître les routes :", options: ["Sur tout le territoire libanais", "Dans les zones où il est autorisé à travailler", "Dans sa zone de résidence"], correct: 1},
{text: "La loi du travail autorise une durée hebdomadaire de travail ne dépassant pas :", options: ["35 heures", "48 heures", "60 heures"], correct: 1},
{text: "Travailler dans la conduite de véhicules au-delà du temps légalement fixé est considéré comme :", options: ["Interdit", "Un travail supplémentaire avec une rémunération majorée", "Un travail supplémentaire avec une rémunération normale"], correct: 1},
{text: "Il faut s'arrêter et céder le passage aux piétons qui traversent la route :", options: ["Lorsque les piétons s'approchent du bord du trottoir", "Lorsque les piétons descendent du bord du trottoir sur la route", "Après que les piétons soient descendus du bord du trottoir sur la route"], correct: 0},
{text: "Le conducteur d'un véhicule public doit s'assurer de la présence de la plaque d'identification du taxi :", options: ["Devant le passager avant", "Devant le siège arrière", "Tout ce qui précède"], correct: 2},
{text: "Le permis de conduire public est renouvelé entre 50 et 65 ans tous les :", options: ["Deux ans", "Trois ans", "Quatre ans"], correct: 1},
{text: "Le permis de conduire public est renouvelé après 65 ans tous les :", options: ["Deux ans", "Trois ans", "Quatre ans"], correct: 0},
{text: "Si un conducteur ou un passager subit une brûlure chimique comme de l'acide de batterie sur la main ou toute autre partie de la peau, il faut :", options: ["Laver soigneusement la peau à l'eau courante pour éliminer les substances", "Appliquer directement une pommade pour brûlures", "Protéger la peau avec une gaze sèche jusqu'à ce que les premiers secours soient prodigués"], correct: 0},
{text: "Si un passager tente de descendre du véhicule soudainement au milieu de la route, le conducteur doit :", options: ["Continuer vers la destination demandée par le passager", "Refuser et s'arrêter immédiatement et prudemment sur le côté de la route", "Réprimander le passager et utiliser le klaxon pour avertir"], correct: 1},
{text: "L'utilisation du téléphone au volant n'est autorisée que :", options: ["Lors de l'envoi de messages texte", "En utilisant le haut-parleur", "Lors d'un arrêt au feu de signalisation"], correct: 1},
{text: "Lors du transport de passagers âgés ou à mobilité réduite, il faut :", options: ["Leur permettre de se déplacer librement", "S'assurer qu'ils attachent leur ceinture de sécurité", "Attacher uniquement les enfants"], correct: 1},
{text: "Lors du transport de passagers, le nombre maximal de passagers dans un taxi est déterminé par le « nombre de sièges » spécifié sur la carte grise du véhicule :", options: ["Hors conducteur", "Conducteur inclus", "En plus des sièges pliants ou pouvant être ajoutés"], correct: 1},
{text: "Un conducteur public est autorisé à remorquer un autre véhicule avec son véhicule à condition qu'il soit :", options: ["Un véhicule en panne", "Un autre taxi", "Non autorisé"], correct: 2},
{text: "Un conducteur public est autorisé à remorquer une moto avec son véhicule :", options: ["Dans les zones intérieures", "Dans les zones non résidentielles", "Non autorisé"], correct: 2},
{text: "Les décisions de classement des routes publiques sont prises par :", options: ["Le ministre de l'Intérieur et des Municipalités", "Le ministre des Travaux publics et des Transports", "Le Premier ministre"], correct: 1},
{text: "En présence d'un feu de signalisation et d'un agent de la circulation, l'usager de la route doit donner la priorité à :", options: ["Le feu de signalisation", "Le signal manuel de l'agent", "Les règles de priorité de passage"], correct: 1},
{text: "La priorité de passage dans les ronds-points est accordée au véhicule qui :", options: ["Entre dans le rond-point", "A déjà commencé à circuler à l'intérieur du rond-point", "A une vitesse supérieure aux autres véhicules approchant du rond-point"], correct: 1},
{text: "La loi sur la circulation sanctionne le « stationnement prolongé » pour les véhicules qui ne bougent pas de leur place de stationnement pendant plus de :", options: ["15 jours", "20 jours", "30 jours et plus"], correct: 2},
{text: "Si un passager de bus ne porte pas sa ceinture de sécurité, l'infraction est considérée comme la responsabilité de :", options: ["La personne concernée", "Le parent du passager", "Le conducteur du véhicule"], correct: 2},
{text: "L'autocollant d'identification pour un véhicule public est apposé :", options: ["Sur les pièces du moteur et le couvercle du coffre", "Près des plaques d'immatriculation du véhicule", "Sur les deux côtés du véhicule"], correct: 2},
{text: "Le panneau « Taxi » ou « Agra » placé sur le toit d'un taxi indique :", options: ["Lorsque le véhicule tourne", "Uniquement la nuit", "Lorsqu'il est vide de passagers"], correct: 2},
{text: "Le chauffeur de taxi doit installer une plaque d'identification du véhicule comme suit :", options: ["Face aux sièges avant et arrière", "Sur les passagers avant et arrière tournés vers l'extérieur", "Tout ce qui précède"], correct: 0},
{text: "Un conducteur public est autorisé à circuler parallèlement à un autre véhicule :", options: ["Dans les zones intérieures", "Dans les zones non résidentielles", "Non autorisé"], correct: 2},
{text: "Un conducteur public est autorisé à transporter des passagers à l'aide d'un véhicule privé contre rémunération :", options: ["Dans les villes secondaires", "En dehors des centres des districts et des gouvernorats", "Non autorisé"], correct: 2},
{text: "Un conducteur public est autorisé, lors du transport de passagers, à actionner les verrouillages des portes extérieures :", options: ["Lorsqu'il y a des enfants après qu'ils soient installés", "Lorsqu'il y a des enfants avant qu'ils soient installés", "Dans tous les cas"], correct: 0},
{text: "Le transport d'armes militaires ou d'armes de chasse est interdit :", options: ["Avec l'autorisation des municipalités", "Avec l'autorisation si cela dépasse deux pièces", "Sans licence des autorités de sécurité compétentes"], correct: 2},
{text: "Engager une conversation personnelle entre conducteurs publics et passagers est lié à :", options: ["Le confort du passager", "Le confort du conducteur", "Tout ce qui précède"], correct: 2},
{text: "Le conducteur public doit clarifier le tarif aux passagers :", options: ["Avant qu'ils n'entrent dans le véhicule", "Après qu'ils soient entrés dans le véhicule", "Uniquement lorsqu'on le lui demande"], correct: 0}
    ];

    const params = new URLSearchParams(window.location.search);
    let count = parseInt(params.get("count"), 10);
    if (isNaN(count) || count < 1) count = allQuestions.length;
    if (count > allQuestions.length) count = allQuestions.length;

    function shuffle(arr) {
      const c = [...arr];
      for (let i = c.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [c[i], c[j]] = [c[j], c[i]];
      }
      return c;
    }
    const selected = shuffle(allQuestions).slice(0, count);

    const area = document.getElementById("questionsArea");
    let score = 0;
    let answered = 0;

    document.getElementById("total").textContent = count;

    selected.forEach((q, i) => {
      const block = document.createElement("div");
      block.className = "question-block";

      block.innerHTML = `
        <p class="question-text"><strong>Question ${i + 1} :</strong> ${q.text}</p>
        <div class="options">
          ${q.options.map((opt, optIdx) => `
            <button class="option" data-q="${i}" data-opt="${optIdx}">${opt}</button>
          `).join("")}
        </div>
      `;

      area.appendChild(block);
    });

    area.addEventListener("click", (e) => {
      const btn = e.target.closest(".option");
      if (!btn) return;

      const qIndex = parseInt(btn.dataset.q, 10);
      const optIndex = parseInt(btn.dataset.opt, 10);
      const question = selected[qIndex];

      const block = btn.closest(".question-block");
      if (block.classList.contains("answered")) return;
      block.classList.add("answered");

      const buttons = block.querySelectorAll(".option");
      buttons[question.correct].classList.add("correct");

      if (optIndex !== question.correct) {
        btn.classList.add("wrong");
      } else {
        score++;
      }

      answered++;
      buttons.forEach(b => b.disabled = true);
      document.getElementById("score").textContent = score;

      if (answered === count) {
        showFinalResult();
      }
    });

    function showFinalResult() {
      const box = document.getElementById("finalResult");
      const pct = Math.round((score / count) * 100);
      box.innerHTML = `
        <i class="fas fa-trophy"></i>
        Votre score final : <strong>${score} / ${count}</strong> (${pct}%)
      `;
      box.classList.add("visible");
      box.scrollIntoView({ behavior: "smooth", block: "center" });
    }

   // ============ CUSTOM CONFIRM ============
const modal = document.getElementById("confirmModal");
const modalMsg = document.getElementById("confirmMessage");
const confirmYes = document.getElementById("confirmYes");
const confirmNo = document.getElementById("confirmNo");

function showConfirm(message, onYes) {
  modalMsg.textContent = message;
  modal.classList.add("visible");

  // Remove old listeners
  const newYes = confirmYes.cloneNode(true);
  const newNo = confirmNo.cloneNode(true);
  confirmYes.parentNode.replaceChild(newYes, confirmYes);
  confirmNo.parentNode.replaceChild(newNo, confirmNo);

  newYes.addEventListener("click", () => {
    modal.classList.remove("visible");
    onYes();
  });

  newNo.addEventListener("click", () => {
    modal.classList.remove("visible");
  });
}

// ============ SUBMIT BUTTON ============
document.getElementById("submitBtn").addEventListener("click", () => {
  if (answered < count) {
    showConfirm(
      `Vous avez répondu à ${answered} sur ${count} questions. Voulez-vous terminer le test ?`,
      showFinalResult
    );
  } else {
    showFinalResult();
  }
});
    const scrollBtn = document.getElementById("scrollTopBtn");

    window.addEventListener("scroll", () => {
      if (window.scrollY > 300) {
        scrollBtn.classList.add("visible");
      } else {
        scrollBtn.classList.remove("visible");
      }
    });

    scrollBtn.addEventListener("click", () => {
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  </script>
