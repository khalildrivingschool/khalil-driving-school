<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

</head>
<body class="questions-page">

  <div class="container">

<!-- CUSTOM CONFIRM MODAL -->
    <div class="custom-modal-overlay" id="confirmModal">

        <div class="custom-modal-icon">
        <i class="fas fa-question-circle"></i>
        </div>

        <div class="custom-modal-actions">
        <button class="custom-modal-btn custom-modal-btn-primary" id="confirmYes">نعم، إنهاء</button>
        <button class="custom-modal-btn custom-modal-btn-secondary" id="confirmNo">إلغاء</button>
        </div>
    </div>
    </div>
  <script>
    const allQuestions = [
      {text: "لكي تتفادى الحادث بدراجتك النارية عند التقاطعات يجب عليك أن:",
       options: ["تخفف سرعتك وتتخذ المسرب الصحيح", "تزيد سرعتك لتعبر بسرعة", "تمر عن يمين المركبات المتوقفة على التقاطع"], correct: 0},

      {text: "حتى لا تزيد السرعة عن طريق الخطأ اثناء القيادة، عليك أن تمسك قبضة مقود الدرّاجة الناريّة بحيث يكون معصم يدك:",
       options: ["اليمنى إلى الأعلى", "اليسرى إلى الأعلى", "اليمنى إلى الأسفل"], correct: 2},

      {text: "تتأمن الحماية الحقيقة لسائق الدرّاجة الناريّة عن طريق:",
       options: ["ارتدائه للملابس الخاصة براكبي الدراجات النارية", "قيادة على الإطار الخلفي فقط", "تأكد من وجود تأمين على الدراجة"], correct: 0},

      {text: "الخوذة الواقية الخاصة براكبي الدراجات النارية تؤمن للسائق حماية:",
       options: ["حاسة السمع من ضوضاء السير", "الرأس من الاصابات القاتلة", "العمود الفقري"], correct: 1},

      {text: "من الأسباب المؤدية إلى تدهور الدرّاجة الناريّة هي وجود:",
       options: ["زيوت وحصى على سطح الطريق", "سيارات ومشاة على الطريق", "شرطة وإشارات ضوئية على الطريق"], correct: 0},

      {text: "لتجنب الإنزلاق عند استخدام فرامل الدرّاجة الناريّة، يجب أن تكون هذه الدراجة منطلقة:",
       options: ["في منعطف", "بسرعة عالية", "باتجاه مستقيم"], correct: 2},

      {text: "يحق لك كدراج أن تتجاوز المركبة التي أمامك:",
       options: ["عن جهة يمينها", "عن جهة يسارها", "عن اي جهة كانت"], correct: 1},

      {text: "ارتداء سائق الدرّاجة الناريّة للقفازات الخاصة بالدراجات النارية يؤمن له:",
       options: ["حماية الرأس عند السقوط", "حماية اليدين من الاصابة ومن البرد", "حماية القدمين عند السقوط"], correct: 1},

      {text: "مجرّد حمل الخوذة الخاصة براكبي الدراجات النارية دون ارتدائها وربطها بشكل صحيح اثناء القيادة:",
       options: ["يعفي السائق من المسائلة القانونية", "لا يعفي السائق من المسائلة القانونية", "هو تصرف منطقي من قبل السائق"], correct: 1},

      {text: "عادة ما يكون سبب الردف بالدرّاجة الناريّة اثناء السير:",
       options: ["التواء عجلة واحدة أو إطار واحد على الأقل", "دوران العجلتان على المحور نفسه", "توزيع سيئ للحملة"], correct: 0},

      {text: "عندما تتجاوز بدراجتك النارية عن يسار مركبةٍ ما أمامك، عليك الانتباه أن هذه المركبة قد:",
       options: ["تخفف سرعتها تدريجيا", "تنعطف يسارًا فجأة", "تشغّل إشارات التحذير"], correct: 1},

      {text: "إذا كانت الدرّاجة الناريّة مجهزة بنظام فراملي هيدروليكي، فيجب دوريًا:",
       options: ["فحص مستوى زيت الفرامل", "التخفيف من استعمال الفرامل", "ضبط عيار سلك الفرامل"], correct: 0},

      {text: "يُنصح سائق الدرّاجة الناريّة اثناء القيادة، ومن أجل تمكين الآخرين من رؤيته ليلاً، أن:",
       options: ["يضع شرائط أو إشارات عاكسة للضوء", "يطفي أنواره ويضع إشارات عاكسة للضوء", "يعمل على جعل فرامله تصدر صريراً"], correct: 0},

      {text: "ارتداء سائق الدرّاجة الناريّة لواقي العمود الفقري الخاص براكبي الدراجات النارية، يؤمن له حماية:",
       options: ["الصدر والبطن، من الحر والبرد", "العمود الفقري والنخاع الشوكي، من المطر", "العمود الفقري والنخاع الشوكي، من الاصابة"], correct: 2},

      {text: "أثناء القيادة الليلية، يجب على سائق الدرّاجة الناريّة ارتداء:",
       options: ["ملابس عادية داكنة اللون", "بدلة فوسفورية خاصة", "ملابس رياضية"], correct: 1},

      {text: "انتعال راكب الدرّاجة الناريّة للحذاء الخاص براكبي الدراجات النارية يؤمن له حماية:",
       options: ["الركبة والفخذ من الماء والبرد", "الركبة والفخذ من الماء والبرد", "القدمين والقصبة من الإصابة، ومن الماء والبرد"], correct: 2},

      {text: "لا يجب أن يقل الحد الأدنى لعمق النقوشات على إطار الدرّاجة الناريّة عن:",
       options: ["5 مليمتر", "3 مليمتر", "6 مليمتر"], correct: 1},

      {text: "عندما تقوم بقيادة دراجتك النارية بشكل متعرج بين المركبات فإن ذلك:",
       options: ["يزيد من احتمال تورطك بحادث", "يقلل من احتمال تورطك بحادث", "يجعل منك سائقا وقائيا"], correct: 0},

      {text: "يجب على سائق الدرّاجة الناريّة، ولكي يستطيع توجيه المقود دون صعوبة، أن:",
       options: ["يجلس بعيدًا عن المقود", "يجلس قريبًا من المقود", "يمسك المقود بيد واحدة"], correct: 1},

      {text: "تكون الفرامل ذات فاعلية قصوى عندما يستخدم سائق الدرّاجة الناريّة:",
       options: ["الفرامل الخلفية فقط", "الفرامل الخلفية والأمامية", "قدمه بالضغط بها على الإسفلت"], correct: 1},

      {text: "عندما تقود دراجتك النارية ذات عادم (اشبمان) مفرغ عمداً ويصدر صوتاً مرتفعاً جدًّا فإن ذلك:",
       options: ["يشهد بانك ذات افكار خالقة", "يُعترب مخالفة قانونية صريحة", "مسموح قانونيا"], correct: 1},

      {text: "البدلات الواقية الجلديّة الخاصة براكبي الدراجات النارية لها قدرة على مقاومة:",
       options: ["القيادة السريعة بين المركبات", "الاحتكاك بالحصى والاسفلت", "الحريق"], correct: 1},

      {text: "عدم ارتداء سائق الدرّاجة الناريّة للخوذة اثناء القيادة، أو ارتداؤه مع ربطها جزئيًا أو عدم ربطها بالمطلق:",
       options: ["يعتبر مُخالفة قانونية", "يعتبر تصرفاً قانونياً", "يعتبر عملاً طبيعياً"], correct: 0},

      {text: "ارتداء سائق الدرّاجة الناريّة للنظارات الواقية الخاصة براكبي الدراجات النارية، يؤمن له حماية:",
       options: ["الأذنين من البرد", "العينين من الريح والرمال والأمطار والحشرات", "العينين من ذرف الدموع"], correct: 1},

      {text: "عندما تقود دراجتك النارية ليلا عليك أن:",
       options: ["تخفف سرعتك وتترك مسافة توقف أقل", "تخفف سرعتك وتترك مسافة توقف أكبر", "تزيد سرعتك وتستعمل الضوء المنخفض"], correct: 1},

      {text: "هناك سببان رئيسيان لانزلاق الدرّاجة الناريّة اثناء القيادة وهما:",
       options: ["المحرك السريع والمقود المرتفع", "سطح الطريق الزلق وردة الفعل العصبية", "السرعة البطيئة وترس السرعة المنخفض"], correct: 1},

      {text: "عندما تقود دراجتك النارية بشكل مستقيم عليك الانتباه أن المركبة القادمة من الاتجاه المعاكس قد:",
       options: ["تنعطف في مسارك فجأة", "تتوقف في مسارها فجأة", "تنعطف بعيدا عن مسارك"], correct: 0},
      {text: "ما السبب الرئيسي الذي يجعل من صيانة دراجتك الآلية بانتظام ضروري؟", options: ["تمكين الدراجة من حمل حقائب", "تسريع الدراجة أكثر من المركبات الأخرى", "حفظ صلاحية الدراجة للسير"], correct: 2},
      {text: "أنت تقود دراجتك الآلية على طريق ريفية. ماذا تفعل إذا صادفت مواشي تستخدم الطريق؟", options: ["تمنحها مساحة كافية", "تقترب منها لإجبارها على افساح المرور", "تطلق بوق دراجتك"], correct: 0},
      {text: "أنت سائق دراجة آلية تقترب من مفرق الى يمينك وتظهر لك سيارة تقترب أيضاً الى المفرق ذاته. ماذا تفعل؟", options: ["تخفف السرعة وتنتظر اشارة السيارة", "تزيد السرعة لتجاوز التقاطع دون تأخير", "تتوقف، لأن السيارة لها حق الأولوية"], correct: 2},
      {text: "دراجتك الآلية متوقفة على طريق ذي اتجاهين. كيف تصعد إلى الدراجة؟", options: ["من اليسار، وتشغل الفرامل الأمامية", "من اليمين، وترخي الفرامل الخلفية", "من اليمين، وتترك الفرامل"], correct: 1},
      {text: "أنت تقود دراجتك الآلية في المدينة ليلاً. الطرق مبللة بعد المطر. كيف ستؤثر عليك انعكاسات الأسطح المبللة؟", options: ["ستُسهل رؤية الأجسام غير المضاءة", "ستُسهل التوقف", "ستُصعب رؤية الأجسام غير المضاءة"], correct: 2},
      {text: "تشعر بالبرد عند قيادة دراجتك الآلية. كيف سيؤثر ذلك عليك؟", options: ["سوف تكون أكثر يقظة", "سوف تفقد التركيز", "سوف تتفاعل بشكل أسرع"], correct: 1},
      {text: "أنت تقود دراجتك الآلية ليلاً، وتبهرك أضواء مركبة تقترب من أمامك. ماذا يجب أن تفعل؟", options: ["تبطئ وتتوقف إذا لزم الأمر", "تطفي مصابيحك الأمامية", "تستخدم الضوء العالي"], correct: 0},
      {text: "دراجتك الآلية لا تحتوي على فرامل مُرتبطة. في حالة الطوارئ، ما الذي يجب عليك فعله للتوقف بسرعة؟", options: ["تشغيل الفرامل الأمامية مباشرةً قبل الفرامل الخلفية", "تشغيل الفرامل الخلفية مباشرةً قبل الفرامل الأمامية", "تشغيل الفرامل الخلفية فقط"], correct: 0},
      {text: "أيّ مما يلي قد يحتاج إلى تعديل عند حمل راكب خلفي؟", options: ["العادم", "المصابيح الأمامية", "إشارتي الاتجاه"], correct: 1},
      {text: "ما هو سطح الطريق الأكثر تأثيراً على خسارة ثبات دراجتك الآلية؟", options: ["الحصى غير المتماسكة", "الاسمنت (الباطون)", "الأسفلت"], correct: 0},
      {text: "متى يُسمح لك بالتوقف على جانب الطريق السريعة؟", options: ["إذا شعرت بالتعب وتحتاج إلى الراحة", "إذا تجاوزت المخرج", "في حالات الطوارئ فقط"], correct: 2},
      {text: "أين يجب على مستخدمي الطريق توخي الحذر بشكل خاص لمراقبة راكبي الدراجات الآلية والمركبات الأخرى؟", options: ["عند التقاطعات", "عند معابر المشاة", "على الطرق ذات الاتجاهين"], correct: 0},
      {text: "كيف يتم ضبط سلسلة الدفع النهائية؟", options: ["إرخاء عزق الاطار الخلفي وشده الى الموقع المناسب", "ارخاء عزق المحرك وشده الى الموقع المناسب", "الجوابان السابقان صحيحان"], correct: 0},
      {text: "لقد قمت بضبط سلسلة الدفع بشكل غير صحيح، ما المشكلة التي قد تحصل؟", options: ["قراءة غير دقيقة لعداد السرعة", "ضبط غير صحيح للعجلة الخلفية", "فقدان قوة الكبح"], correct: 1},
      {text: "تحتاج إلى نفخ إطاري دراجتك. كيف يمكنك معرفة الضغط المناسب؟", options: ["بالتحقق من دليل استخدام الدراجة", "يظهر على جانب الإطار", "يظهر مختوماً على العجلة"], correct: 0},
      {text: "أنت تحمل راكبًا في العربة الجانبية. ما الذي يجب عليك تعديله لاستيعاب الوزن الزائد؟", options: ["ميزان العجلتين الأمامية والخلفية", "عيار الوزن على الشوكة الأمامية", "عيار الوزن على ممتص الصدمات الخلفي"], correct: 2},
      {text: "لماذا يجب عليك التحقق من فوق كتفك قبل الانعطاف يساراً إلى طريق جانبي؟", options: ["للتحقق من وجود حركة مرور قادمة", "للتحقق من عدم وجود مركبات تتجاوزك", "للتأكد من كون الطريق الجانبي حراً"], correct: 1},
      {text: "ما الإجراءات الوقائية التي يمكنك اتخاذها لحماية دراجتك الآلية من خطر الحريق؟", options: ["تجنب القيادة بخزان وقود ممتلئ", "التحقق من عدم وجود أي رائحة وقود (بنزين) قوية", "استخدام بنزين خالي من الرصاص"], correct: 1},
      {text: "أنت تنعطف يساراً للخروج من طريق باتجاهين إلى طريق باتجاهين. ما الذي يجب عليك فعله قبل الخروج؟", options: ["تتحقق من عرض الحاجز الوسطي", "تلتزم الجانب الأيسر من المسرب", "تتوقف، ثم تختار غيار سرعة منخفضاً جداً"], correct: 0},
      {text: "ما الذي يجعل رؤيتك مع دراجتك أكثر وضوحاً في ضوء النهار؟", options: ["ارتداء خوذة سوداء", "ارتداء سترة داكنة", "ارتداء سترة فاتحة اللون"], correct: 2},
      {text: "ما الذي يجب عليك التحقق منه بعد الانتهاء من شد سلسلة الدفع؟", options: ["ميزان العجلة الخلفية", "ضغط الإطار الخلفي", "سلامة ممتص الصدمات الخلفي"], correct: 0},
{text: "حصل معك حادث تصادم مع مركبة وأصيب شخص وتضررت دراجتك الآلية. ما الذي يجب عليك معرفته؟", options: ["تفاصيل تأمين مركبة السابق", "ما إذا كان السائق هو مالك المركبة", "ما إذا كان السائق مرخصًا له بالقيادة"], correct: 0},
{text: "ماذا تفعل عندما تواجه عائقاً على جانبك من الطريق؟", options: ["تزيد سرعتك لتتجاوز أولاً", "تستمر، فلديك الأولوية", "تفسح الطريق للمركبات المقبلة"], correct: 2},
{text: "لقد عبرت للتو مياهاً عميقة. ماذا يجب أن تفعل للتأكد من أن فراملك تعمل بشكل صحيح؟", options: ["تتجنب نهائياً استخدام الفرامل لمسافة كيلومترات", "تسير ببطء مع الضغط برفق على الفرامل", "تتوقف لمدة ساعة على الأقل لإعطائها وقتاً لتجف"], correct: 1},
{text: "بعض الطرق ذات الاتجاهين تقسم إلى ثلاثة مسارب. لماذا تُعد هذه الطرق خطرة بشكل خاص؟", options: ["لأنه يمكن للمركبات أن تتجاوز عن جهة اليمين", "لأنه يُسمح باستخدام المسرب الأوسط لتجاوز المركبات في كلا الاتجاهين", "لأن المسرب الأوسط يُستخدم فقط في حالات الطوارئ"], correct: 1},
{text: "قبل بدء الرحلة، من الحكمة تخطيط مسارها. كيف يمكنك القيام بذلك؟", options: ["تتواصل مع ورش تصليح قريبة من المسار", "تطّلع على الخريطة", "تطّلع على دليل استخدام دراجتك"], correct: 1},
{text: "تتألف عدة الوقاية الشخصية لسائق الدراجة الآلية وراكبها من:", options: ["الخوذة والقفازات", "الخوذة والسترة والبنطال والحذاء", "الخوذة والقفازات والحذاء"], correct: 1},
{text: "وصلت إلى موقع حادث. شخص ينزف بشدة من جرح في ذراعه وغير مغروز فيها شيء. ماذا يجب أن تفعل؟", options: ["تضغط على الجرح وتترك الذراع منخفضة", "تضغط على الجرح وترفع الذراع", "تترك الجرح ينزف"], correct: 1},
{text: "في حالة وقوع حادث، لا يتنفس المصاب. ماذا يجب أن تفعل أثناء مساعدته على استعادة تنفسه؟", options: ["تديره الى جانبه", "تهزه بقوة", "تميل رأسه للخلف وترفع الفك"], correct: 2},
{text: "وقع حادث تصادم. راكب الدراجة الآلية مُصابٌ وفاقدٌ للوعي. لماذا لا يجب عادة ان تنزع خوذته، إلا عند الضرورة القصوى؟", options: ["قد لا يرغب في ذلك", "قد يؤدي ذلك إلى إصابة أكثر خطورة", "قد يتعرض لحَرّ شديد او برد شديد"], correct: 1},
{text: " يبدأ سائق سيارة مبتدئ بالدخول الى مسربك من طريق جانبي على اليمين. ماذا تفعل؟",options:["تستعد للإبطاء والتوقف","تدعه يدخل، ثم تسير خلفه مباشرةً","تنعطف إلى الطريق الجانبي"],correct:0},
{text:"يقود سائق سيارة مبتدئ المركبة التي أمامك. ماذا ",options: [" تحافظ على هدوئك وتتحلى بالصبر","تسرع","تضغط على البوق"],correct:0},
{text: "أنت تنقل حمولة على رف أمتعة دراجتك الآلية. ما الذي يجب عليك التأكد منه؟", options: ["أن تكون الحمولة مغطاة بغطاء بلاستيكي", "أن تكون الحمولة مرئية بوضوح", "أن تكون الحمولة مثبتة بإحكام"], correct: 2},
{text: "لقد مررت للتو في تجمع ماء عميق. ما الذي يجب عليك التحقق منه بعد أن تكون قد ابتعدت عن الماء؟", options: ["الفرامل", "المصابيح الأمامية", "التوجيه"], correct: 0},
{text: "هطلت الأمطار بعد فترة طويلة من الحر والجفاف. كيف يؤثر ذلك على سطح الطريق؟", options: ["قد تُغطى بالحصى", "قد تصبح زلقة بشكل غير طبيعي", "قد يتفتت سطح الطريق ويتكسر"], correct: 1},
{text: "عند الانعطاف، ماذا يجب أن يفعل راكب الدراجة الخلفي؟", options: ["يعطي إشارات اتجاه بذراعيه نيابةً عنك", "ينحني جانبًا لرؤية الأمام", "ينحني معك في المنعطفات"], correct: 2},
{text: "ما الذي يمكن أن يسببه وجود حمولة ثقيلة في صندوق الدراجة الآلية العلوي؟", options: ["تحسين الكبح", "تحسين توازن الدراجة", "تخفيض توازن الدراجة"], correct: 2},
{text: "في ظروف القيادة العادية، كيف يجب أن تستخدم الفرامل؟", options: ["استخدام الفرامل الخلفية أولاً ثم الأمامية", "عند الانعطاف بالدراجة الآلية أو خلال قيادتها عبر منعطف", "عندما تكون الدراجة الآلية في اتجاه مستقيم وتتحرك في خط مستقيم"], correct: 2},
{text: "أي مما يلي ينتج عن شرب الكحول؟", options: ["ردود فعل أسرع", "زيادة التركيز", "ضعف القدرة على التمييز"], correct: 2},
{text: "دراجتك الآلية مجهزة بـ \"محوّل حفّاز\" (catalytic converter). ما الذي يقلله؟", options: ["ضجيج المحرك", "الانبعاثات العامة", "ضجيج العادم"], correct: 1},
{text: "انتظرت بعض الوقت للانعطاف يساراً إلى طريق جانبي. ماذا يجب أن تقعل قبل الانعطاف مباشرةً؟", options: ["الالتفات يمينًا ويسارًا - إلقاء نظرة منقذة للحياة", "الاقتراب الى جهة الرصيف", "التلويح لحركة المرور القادمة"], correct: 0},
{text: "متى يجب زيادة ضغط إطارات دراجتك الآلية؟", options: ["عند حمل حمولة ثقيلة", "عند القيادة في طقس حار", "عند القيادة في طقس ممطر"], correct: 0},
{text: "كيف تُحافظ على الفرامل التي تعمل بالأسلاك؟", options: ["بفحصها في درجة حرارة التشغيل العادية", "بتزييتها وضبطها بانتظام", "بإزالة أي حركة حرة للرافعة أو الدواسة"], correct: 1},
{text: "تتكون مسافة التوقف الإجمالية من مسافة التفكير ومسافة الكبح. أنت على طريق جاف وجيد، مع فرامل وإطارات جيدة. ما هي مسافة الكبح النموذجية عند سرعة 75 كلم في الساعة؟", options: ["24 مترا", "38 مترا", "55 مترا"], correct: 1},
{text: "لست متأكدًا مما إذا كان دواء السعال سيؤثر على قدرتك على القيادة بأمان. ماذا تفعل؟", options: ["تستشير صديقًا أو قريبًا", "تستشير طبيبك أو الصيدلاني", "لا تتناول الدواء"], correct: 1},
{text: "لماذا يكون سائقو الدراجات الآلية الشباب أكثر عرضة للتعرض للحوادث؟", options: ["لأنهم يقودون في مجموعات", "لأنهم قليل الخبرة", "لأنهم حذرون جدًا عند التقاطعات"], correct: 1},
{text: "أنت في طريق ذي اتجاه واحد وتريد الانعطاف يسارًا. يوجد مسربين. في أي مسرب يجب عليك ان تضع دراجتك؟", options: ["في المسرب الأيسر", "في المسرب الأيمن", "على يمين الخط الوسطي الفاصل مباشرة"], correct: 0},
{text: "انحرف سائق مركبة من طريق جانبي أمامك، مما دفعك إلى الضغط على المكابح بقوة. ماذا يجب أن تفعل؟", options: ["تضيء أنوار الطريق لإظهار انزعاجك", "تتجاهل الخطأ وتحافظ على هدوئك", "تطلق بوق دراجتك لإظهار انزعاجك"], correct: 1},
{text: "ماذا تفعل عندما ترى اثنين من المشاة المسنين على وشك عبور الطريق أمامك؟", options: ["تكون حذرًا؛ فقد يخطئان في تقدير سرعتك", "تتوقع أن ينتظرك حتى تمر", "تزيد سرعتك لتتجاوزهما بسرعة"], correct: 0},
{text: "من هو مستخدم الطريق الأكثر عرضة للخطر عند تقاطعات الطرق؟", options: ["سائق سيارة", "سائق شاحنة", "سائق دراجة آلية"], correct: 2},
{text: "أنت تقترب من دوّار. هناك خيول أمامك مباشرةً. ماذا تفعل؟", options: ["تمنحها مساحة كافية", "تطلق بوق دراجتك كتحذير", "تعاملها كأي مركبة أخرى"], correct: 0},
{text: "أنت تتبع شاحنة على طريق مبلل. ماذا تفعل عندما يصعّب رذاذ المطر رؤية الطريق أمامك؟", options: ["تزيد المسافة بينك وبينها لتحسين الرؤية", "تبقى قريبًا من الشاحنة، بعيدًا عن رذاذ المطر", "تشغّل مصابيحك الأمامية بأقصى سرعة"], correct: 0},
{text: "انت تلتزم بمسافة ملاحقة طويلة بانتظار تجاوز مركبة كبيرة. ماذا تفعل إذا دخلت سيارة في هذه المسافة؟", options: ["تخفف سرعتك لاستعادة مسافة ملاحقة آمنة", "تضيء مصابيح الطريق", "تشغّل بوق السيارة"], correct: 0},

{text: "سائق المركبة التي أمامك يسير بشكل مستقيم وتعتقد أنه نسي إلغاء إشارة الانعطاف اليسرى. ماذا تفعل؟", options: ["تضيء أنوارك لتنبيه السائق", "تتجاوز من اليمين إذا كان ذلك ممكنًا", "تبقى خلفه ولا تتجاوزه"], correct: 1},
{text: "أنت تتبع مركبة على مسافة آمنة على طريق مبلل. يتجاوزك سائق آخر ويدخل ضمن مسافة الملاحقة التي تركتها أمامك. ماذا تفعل؟", options: ["تخفف سرعتك لاستعادة مسافة ملاحقة آمنة", "تضيء مصابيحك الأمامية كتحذير", "تحاول التجاوز بأقرب فرصة سانحة آمنة"], correct: 0},
{text: "وُضع شخص مصاب في وضعية المعالجة. إنه فاقد للوعي ولكنه يتنفس بشكل طبيعي. ما الذي يجب فعله أيضاً؟", options: ["تتأكد من أن مجرى الهواء للتنفس مفتوح", "تضع ذراعيه الى جانبه", "تضغط بقوة بين كتفيه"], correct: 0},
{text: "أنت أول من يصل إلى موقع حادث يُصاب فيه أشخاص بجروح بالغة. لقد شغلت أضواء التنبيه من الخطر وتأكدت من إيقاف جميع المحركات. ماذا تفعل أيضاً؟", options: ["تتأكد من استدعاء سيارة إسعاف", "تُبعد المصابين عن سياراتهم", "توقف السيارات الأخرى وتطلب المساعدة من سائقها"], correct: 0},
{text: "وقع حادث، يعاني شخص ما من حروق بالغة. ما الذي يمكنك فعله لمساعدته؟", options: ["تضع مرهماً على الإصابة", "تغسل الحروق بسائل نظيف وبارد ومعقم", "تزيل أي شيء ملتصق بالحروق"], correct: 1},
{text: "وقع حادث تصادم للتو. شخص مصاب مستلقٍ على طريق مزدحم. ما أول شيء يجب عليك فعله لمساعدته؟", options: ["تتأكد من إبقاء المصاب دافئًا", "تعالج المصاب من الصدمة", "تحذّر حركة المرور الأخرى"], correct: 2},
{text: "أنت تقترب من طريق سطحها حصى غير متماسكة. ماذا يجب أن تفعل؟", options: ["القيادة بشكل عادي", "تخفيض السرعة", "التوقف المفاجئ"], correct: 1},
{text: "ماذا سيحدث إذا نظرت إلى أسفل العجلة الأمامية أثناء القيادة؟", options: ["سيجعل توجيهك أسهل", "سيؤثر ذلك سلباً على توازنك", "ستستهلك وقودًا أقل"], correct: 1},
{text: "ما الذي يجب عليك فحصه بعد إعادة تركيب العجلة الخلفية؟", options: ["حاملك الجانبي", "التحميل المسبق لنظام التطبيق", "ميزان العجلة"], correct: 2},

{text: "يُستخدم \"مفتاح فصل المحرك\":", options: ["لتقليل السرعة في حالات الطوارئ", "لإيقاف المحرك في حالات الطوارئ", "لإيقاف المحرك بشكل طبيعي"], correct: 1},

{text: "يُسمح لك باستخدام بوق الدراجة:", options: ["لإعطائك حق الأولوية", "لإجبار السائقين البطيئين على التجاوز", "لتحذير الآخرين من وجودك"], correct: 2},

    const params = new URLSearchParams(window.location.search);
    let count = parseInt(params.get("count"), 10);
    if (isNaN(count) || count < 1) count = allQuestions.length;
    if (count > allQuestions.length) count = allQuestions.length;

    function shuffle(arr) {
      const c = [...arr];
      for (let i = c.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [c[i], c[j]] = [c[j], c[i]];
      }
      return c;
    }
    const selected = shuffle(allQuestions).slice(0, count);

    const area = document.getElementById("questionsArea");
    let score = 0;
    let answered = 0;

    document.getElementById("total").textContent = count;

    selected.forEach((q, i) => {
      const block = document.createElement("div");
      block.className = "question-block";

      block.innerHTML = `
        <p class="question-text"><strong>سؤال ${i + 1}:</strong> ${q.text}</p>
        <div class="options">
          ${q.options.map((opt, optIdx) => `
            <button class="option" data-q="${i}" data-opt="${optIdx}">${opt}</button>
          `).join("")}
        </div>
      `;

      area.appendChild(block);
    });

    area.addEventListener("click", (e) => {
      const btn = e.target.closest(".option");
      if (!btn) return;

      const qIndex = parseInt(btn.dataset.q, 10);
      const optIndex = parseInt(btn.dataset.opt, 10);
      const question = selected[qIndex];

      const block = btn.closest(".question-block");
      if (block.classList.contains("answered")) return;
      block.classList.add("answered");

      const buttons = block.querySelectorAll(".option");
      buttons[question.correct].classList.add("correct");

      if (optIndex !== question.correct) {
        btn.classList.add("wrong");
      } else {
        score++;
      }

      answered++;
      buttons.forEach(b => b.disabled = true);
      document.getElementById("score").textContent = score;

      if (answered === count) {
        showFinalResult();
      }
    });

    function showFinalResult() {
      const box = document.getElementById("finalResult");
      const pct = Math.round((score / count) * 100);
      box.innerHTML = `
        <i class="fas fa-trophy"></i>
        نتيجتك النهائية: <strong>${score} / ${count}</strong> (${pct}%)
      `;
      box.classList.add("visible");
      box.scrollIntoView({ behavior: "smooth", block: "center" });
    }

// ============ CUSTOM CONFIRM ============
const modal = document.getElementById("confirmModal");
const modalMsg = document.getElementById("confirmMessage");
const confirmYes = document.getElementById("confirmYes");
const confirmNo = document.getElementById("confirmNo");

function showConfirm(message, onYes) {
  modalMsg.textContent = message;
  modal.classList.add("visible");

  // Remove old listeners
  const newYes = confirmYes.cloneNode(true);
  const newNo = confirmNo.cloneNode(true);
  confirmYes.parentNode.replaceChild(newYes, confirmYes);
  confirmNo.parentNode.replaceChild(newNo, confirmNo);

  newYes.addEventListener("click", () => {
    modal.classList.remove("visible");
    onYes();
  });

  newNo.addEventListener("click", () => {
    modal.classList.remove("visible");
  });
}

// ============ SUBMIT BUTTON ============
document.getElementById("submitBtn").addEventListener("click", () => {
  if (answered < count) {
    showConfirm(
      `لقد أجبت على ${answered} من ${count} سؤال. هل تريد إنهاء الاختبار؟`,
      showFinalResult
    );
  } else {
    showFinalResult();
  }
});

    scrollBtn.addEventListener("click", () => {
      window.scrollTo({ top: 0, behavior: "smooth" });
