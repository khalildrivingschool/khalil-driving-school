<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اختبار المركبات الثقيلة</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="css/mock.css">
    <link rel="icon" type="image/jpeg" href="الخليل.jpeg">

</head>
<body class="questions-page">

  <!-- LIVE SCORE BOX -->
  <div class="score-box" id="scoreBox">
    <span class="score-label">الإجابات الصحيحة:</span>
    <span class="score-value"><span id="score">0</span> / <span id="total">0</span></span>
  </div>

  <div class="container">
    <h1 class="page-title">اختبار المركبات الثقيلة</h1>
    <div id="questionsArea"></div>

    <div class="submit-wrap">
      <button id="submitBtn" class="start-btn">
        <i class="fas fa-check"></i>
        إنهاء الاختبار
      </button>
    </div>

    <div id="finalResult" class="final-result"></div>
  </div>

  <button id="scrollTopBtn" class="scroll-top-btn" aria-label="العودة للأعلى">
    <i class="fas fa-chevron-up"></i>
  </button>
  <!-- CUSTOM CONFIRM MODAL -->
    <div class="custom-modal-overlay" id="confirmModal">
    <div class="custom-modal">
        <div class="custom-modal-icon">
        <i class="fas fa-question-circle"></i>
        </div>
        <h3 class="custom-modal-title">إنهاء الاختبار</h3>
        <p class="custom-modal-text" id="confirmMessage"></p>
        <div class="custom-modal-actions">
        <button class="custom-modal-btn custom-modal-btn-primary" id="confirmYes">نعم، إنهاء</button>
        <button class="custom-modal-btn custom-modal-btn-secondary" id="confirmNo">إلغاء</button>
        </div>
    </div>
    </div>

  <script>
    const allQuestions = [

   
      {text: "قيادة المركبة الثقيلة على طريق وعرة تحتّم عليك أن:",
       options: ["تزيد من سرعتك قليلا", "تكون حذراً وأن تخطط للطريق مسبقاً", "تركز اهتمامك الى الخلف"], correct: 1},
{text: "إن استعمالك للمكابح الرئيسية في الشاحنة بشكل متواصل على منحدر طويل، يبطل مفعول:", options: ["الكابح بسبب ارتفاع حرارة الخمادات.", "البطارية بسبب الإستهلاك الزائد للكهرباء.", "الرادياتور بسبب الحرارة الزائدة في المحرك."], correct: 0},
{text: "عندما تقود شاحنتك على منحدر طويل، يجب عليك أن تستعمل ترس سرعة:", options: ["عالي والكوابح الإضافية.", "منخفض والكوابح الإضافية.", "منخفض وفرامل اليد."], correct: 1},
{text: "إذا دخلت منحدراً طويلاً بالشاحنة وتأخرت بالإنتقال الى ترس سرعة منخفض وأصبحت سرعتك عالية، فسوف:", options: ["يصبح من السهل عليك الإنتقال الى ترس سرعة منخفض.", "تنخفض سرعتك تلقائياً.", "يصبح من المستحيل الإنتقال الى ترس سرعة منخفض للسيطرة على المركبة."], correct: 2},
{text: "عند قيادتك الشاحنة صعوداً، يجب عليك أن تختار ترس سرعة:", options: ["منخفض يتناسب مع شدة المرتفع ووزن حمولة مركبتك.", "عالي يتناسب مع شدة المرتفع ولكن لا يتناسب مع وزن الحمولة.", "منخفض لا يتناسب مع شدة المرتفع ووزن الحمولة."], correct: 0},
{text: "عند قيادتك للشاحنة صعوداً متواصلاً، يجب عليك:", options: ["تجنب إجهاد المحرك.", "حافظ على سرعة الشاحنة قدر المستطاع.", "عدم السماح للمركبات الصغيرة بتجاوزك."], correct: 1},
{text: "عند قيادتك للشاحنة صعوداً متواصلاً، يجب عليك:", options: ["النظر إلى مؤشر الحرارة معظم الوقت.", "إلتزام أقصى اليسار قدر المستطاع.", "إلتزام أقصى اليمين قدر المستطاع."], correct: 2},
{text: "عند قيادتك الشاحنة صعوداً، يجب عليك:", options: ["تسهيل مهمة الآخرين حين يتجاوزونك.", "عدم تسهيل مهمة الآخرين حين يتجاوزونك.", "التزمير للآخرين حين يتجاوزونك."], correct: 0},
{text: "إذا كنت تريد أن تتجاوز بشاحنتك مركبة أخرى صعوداً، وكان ذلك سيستغرقك وقتاً طويلاً، فعليك أن:", options: ["تصر على القيام بهذا التجاوز.", "تزيد من سرعتك.", "تصرف النظر عن هذا التجاوز."], correct: 2},
{text: "إن قيادة الشاحنة على طريق وعرة، تحدّم عليك أن:", options: ["تزيد من سرعتك قليلاً.", "تكون حذراً وأن تخطط للطريق مسبقاً.", "لا تعطي الأمر أية أهمية."], correct: 1},
{text: "إن شاحنة محملة لا يمكنها نقل أكثر من:", options: ["شخصين.", "شخص واحد.", "وفق العدد المحدّد في الرخصة."], correct: 2},
{text: "على كل سائق شاحنة أن ينتبه إلى عرض مركبته خاصة:", options: ["عند تجاوزه لمركبة أخرى.", "عند قيادته في الطرق المفتوحة.", "عند أخذه قسطاً من الراحة."], correct: 0},
{text: "على سائق الشاحنة الصغيرة أن:", options: ["يرجع إلى الخلف في الأماكن المكتظة.", "يرجع إلى الخلف داخل النفق.", "يتفادى الرجوع إلى الخلف في الأماكن المكتظة."], correct: 2},
{text: "على سائق الشاحنة الصغيرة أن:", options: ["يلم ببعض خصائص مركبته.", "يلم بكل خصائص مركبته.", "يلم بخصائص مركبة السائق الآخر."], correct: 1},
{text: "يكمن الخطر أثناء القيادة عند الإقتراب من قمة مرتفع في:", options: ["عدم رؤية ما يجري خلف المرتفع.", "إزداد اندفاع المركبة تلقائياً.", "إنخفاض درجة حرارة المحرك."], correct: 0},
{text: "عند اقترابك من قمة مرتفع على سرعة عالية، عليك أن:", options: ["تزيد سرعتك.", "تحافظ على سرعتك.", "تخفف سرعتك."], correct: 2},
{text: "عند اقترابك من قمة مرتفع، عليك أن تتوقع خلف القمة:", options: ["وجود عقبات.", "عدم وجود عقبات.", "انفراجاً في حركة المرور."], correct: 0},
{text: "إذا استعملت الزمور بشكل متواصل عند اقترابك من قمة مرتفع، فإن ذلك:", options: ["سيمكنك من سماع زمور الآخرين.", "سيمنعك من سماع زمور القادمين من خلف القمة.", "لن يساعدك بشيء."], correct: 1},
{text: "عندما تقترب بشاحنتك من منحدر على سرعة عالية، يجب عليك أن تُخفف سرعتك و:", options: ["تختار ترس سرعة أعلى.", "تبقى على نفس ترس السرعة.", "تختار ترس سرعة أقل."], correct: 2},
{text: "عندما تقود شاحنتك على منحدر، للسيطرة على مركبتك يجب عليك أن تعتمد على:", options: ["كابح الخدمة وكابح الوقوف.", "الترس العالي بالدرجة الأولى.", "الترس المنخفض بالدرجة الأولى."], correct: 2},
{text: "أثناء قيادة الشاحنة على مختلف الطرقات، يجب عليك أن:", options: ["تتجنب الطرق الوعرة قدر المستطاع.", "تختار الطرق الوعرة لأنها أقل زحمة.", "تختار الطرق الوعرة لأنها ذات صفة طبيعية."], correct: 0},
{text: "إذا توجب على سائق المركبة أن يرجع بمركبته إلى الخلف، يجب عليه أن:", options: ["يرجع على سرعة رجوع معتدلة.", "يجعل مسافة الرجوع أطول مسافة ممكنة.", "يجعل مسافة الرجوع أقصر مسافة ممكنة."], correct: 2},
{text: "كسائق شاحنة، يلزمك القانون بإعطاء الأفضلية:", options: ["للمركبات المسرعة.", "للحافلات المدرسية المستخدمة لأنوار التحذير.", "للمركبات المبطنة."], correct: 1},
{text: "إن المرايا المحدبة في المركبات تظهر الأجسام:", options: ["على مسافات أبعد مما هي عليه.", "على مسافات أقرب مما هي عليه.", "بشكل غير واضح."], correct: 0},
{text: "عندما ينظر سائق المركبة في المرأة المحدبة، فإنه يرى فيها الأجسام:", options: ["على حجمها العادي.", "بشكل مصغر.", "بشكل باهت."], correct: 1},
{text: "على سائق المركبة إذا كان يتعاطى الأدوية الطبية، أن يعرف مدى تأثير هذه الأدوية على القيادة وذلك:", options: ["قبل القيادة.", "أثناء القيادة.", "بعد حصول الحادث."], correct: 0},
{text: "إن بعض الأدوية الطبية لها تأثير منوّم، لذلك يجب على السائق أن:", options: ["يتناولها عند مشارفة القيادة على الإنتهاء.", "يتناولها بعد الانتهاء من القيادة.", "لا يتناولها."], correct: 1},
{text: "إن أفضل وسيلة ليعرف السائق مدى تأثير الدواء الطبي على قيادته هي أن:", options: ["يسأل أحد السائقين.", "يسأل الطبيب المعالج.", "يتناول الدواء ويجربه في القيادة."], correct: 1},
{text: "من الوسائل المساعدة التي تمكّن السائق من معرفة مدى تأثير الدواء الطبي على قيادته هي:", options: ["تناوله الدواء دون الرجوع الى ورقة التعليمات المرفقة.", "تناول الدواء قبل القيادة وقراءة ورقة التعليمات بعد القيادة.", "قراءة ورقة التعليمات المرفقة مع الدواء قبل تناول الدواء وقبل القيادة."], correct: 2},
{text: "يستطيع سائق المركبة أن يعرف مدى التأثير الذي يسببه الدواء على قيادته عن طريق:", options: ["سؤاله للصيدلي قبل البدء بالقيادة وقبل تناول الدواء.", "سؤاله للصيدلي على الهاتف أثناء القيادة وبعد تناول الدواء.", "تجربة ذلك بنفسه فيتناول الدواء أثناء القيادة."], correct: 0},
{text: "على كل سائق شاحنة أن ينتبه الى عرض مركبته خاصة:", options: ["عند دخوله في مكان ضيق.", "عند قيادته في الأماكن المفتوحة.", "قبل تفريغ حمولته."], correct: 0},
{text: "على سائق الشاحنة الصغيرة أن:", options: ["يرجع الى الخلف في الأماكن المكثفة.", "يرجع الى الخلف بعد التقاطع مباشرة.", "يتفادى الرجوع الى الخلف في الأماكن المكثفة."], correct: 2},
{text: "على سائق محملة بخزانات او براميل، قبل بدء الرحلة، أن يتأكد من أن:", options: ["كل أغطية الخزانات او البراميل محكمة الإغلاق.", "بعض أغطية الخزانات محكمة الإغلاق.", "الخزانات او البراميل ممتلئة او فارغة كلياً ومحكمة الاغلاق."], correct: 2}
    ];

    const params = new URLSearchParams(window.location.search);
    let count = parseInt(params.get("count"), 10);
    if (isNaN(count) || count < 1) count = allQuestions.length;
    if (count > allQuestions.length) count = allQuestions.length;

    function shuffle(arr) {
      const c = [...arr];
      for (let i = c.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [c[i], c[j]] = [c[j], c[i]];
      }
      return c;
    }
    const selected = shuffle(allQuestions).slice(0, count);

    const area = document.getElementById("questionsArea");
    let score = 0;
    let answered = 0;

    document.getElementById("total").textContent = count;

    selected.forEach((q, i) => {
      const block = document.createElement("div");
      block.className = "question-block";

      block.innerHTML = `
        <p class="question-text"><strong>سؤال ${i + 1}:</strong> ${q.text}</p>
        <div class="options">
          ${q.options.map((opt, optIdx) => `
            <button class="option" data-q="${i}" data-opt="${optIdx}">${opt}</button>
          `).join("")}
        </div>
      `;

      area.appendChild(block);
    });

    area.addEventListener("click", (e) => {
      const btn = e.target.closest(".option");
      if (!btn) return;

      const qIndex = parseInt(btn.dataset.q, 10);
      const optIndex = parseInt(btn.dataset.opt, 10);
      const question = selected[qIndex];

      const block = btn.closest(".question-block");
      if (block.classList.contains("answered")) return;
      block.classList.add("answered");

      const buttons = block.querySelectorAll(".option");
      buttons[question.correct].classList.add("correct");

      if (optIndex !== question.correct) {
        btn.classList.add("wrong");
      } else {
        score++;
      }

      answered++;
      buttons.forEach(b => b.disabled = true);
      document.getElementById("score").textContent = score;

      if (answered === count) {
        showFinalResult();
      }
    });

    function showFinalResult() {
      const box = document.getElementById("finalResult");
      const pct = Math.round((score / count) * 100);
      box.innerHTML = `
        <i class="fas fa-trophy"></i>
        نتيجتك النهائية: <strong>${score} / ${count}</strong> (${pct}%)
      `;
      box.classList.add("visible");
      box.scrollIntoView({ behavior: "smooth", block: "center" });
    }

    // ============ SUBMIT BUTTON ============
// ============ CUSTOM CONFIRM ============
const modal = document.getElementById("confirmModal");
const modalMsg = document.getElementById("confirmMessage");
const confirmYes = document.getElementById("confirmYes");
const confirmNo = document.getElementById("confirmNo");

function showConfirm(message, onYes) {
  modalMsg.textContent = message;
  modal.classList.add("visible");

  // Remove old listeners
  const newYes = confirmYes.cloneNode(true);
  const newNo = confirmNo.cloneNode(true);
  confirmYes.parentNode.replaceChild(newYes, confirmYes);
  confirmNo.parentNode.replaceChild(newNo, confirmNo);

  newYes.addEventListener("click", () => {
    modal.classList.remove("visible");
    onYes();
  });

  newNo.addEventListener("click", () => {
    modal.classList.remove("visible");
  });
}

// ============ SUBMIT BUTTON ============
// ============ CUSTOM CONFIRM ============

// ============ SUBMIT BUTTON ============
document.getElementById("submitBtn").addEventListener("click", () => {
  if (answered < count) {
    showConfirm(
      `لقد أجبت على ${answered} من ${count} سؤال. هل تريد إنهاء الاختبار؟`,
      showFinalResult
    );
  } else {
    showFinalResult();
  }
});

    const scrollBtn = document.getElementById("scrollTopBtn");

    window.addEventListener("scroll", () => {
      if (window.scrollY > 300) {
        scrollBtn.classList.add("visible");
      } else {
        scrollBtn.classList.remove("visible");
      }
    });

    scrollBtn.addEventListener("click", () => {
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  </script>

</body>
</html>
