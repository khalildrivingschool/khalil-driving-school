<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Véhicules Lourds</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="css/mock.css">
    <link rel="icon" type="image/jpeg" href="الخليل.jpeg">

</head>
<body class="questions-page">

  <div class="score-box" id="scoreBox">
    <span class="score-label">Bonnes réponses :</span>
    <span class="score-value"><span id="score">0</span> / <span id="total">0</span></span>
  </div>

  <div class="container">
    <h1 class="page-title">Test Véhicules Lourds</h1>
    <div id="questionsArea"></div>

    <div class="submit-wrap">
      <button id="submitBtn" class="start-btn">
        <i class="fas fa-check"></i>
        Terminer le test
      </button>
    </div>

    <div id="finalResult" class="final-result"></div>
  </div>

  <button id="scrollTopBtn" class="scroll-top-btn" aria-label="Retour en haut">
    <i class="fas fa-chevron-up"></i>
  </button>
<!-- CUSTOM CONFIRM MODAL -->
<div class="custom-modal-overlay" id="confirmModal">
  <div class="custom-modal">
    <div class="custom-modal-icon">
      <i class="fas fa-question-circle"></i>
    </div>
    <h3 class="custom-modal-title">Terminer le Test</h3>
    <p class="custom-modal-text" id="confirmMessage"></p>
    <div class="custom-modal-actions">
      <button class="custom-modal-btn custom-modal-btn-primary" id="confirmYes">Oui, Terminer</button>
      <button class="custom-modal-btn custom-modal-btn-secondary" id="confirmNo">Annuler</button>
    </div>
  </div>
</div>
  <script>
    const allQuestions = [

      {text: "Lors du débranchement du tracteur de la remorque, le conducteur doit :",
       options: ["Serrer le frein de la remorque et abaisser ses pieds au maximum", "Relâcher le frein de la remorque et abaisser ses pieds au maximum", "Serrer le frein de la remorque sans abaisser ses pieds au maximum"], correct: 0},

      {text: "Tout conducteur de véhicule lourd doit faire attention à la largeur de son véhicule surtout :",
       options: ["Lorsqu'il dépasse un autre véhicule", "Lorsqu'il conduit sur des routes ouvertes", "Lorsqu'il prend une pause"], correct: 0},

      {text: "Si vous abordez une longue descente avec votre véhicule lourd et que vous tardez à passer à une vitesse inférieure, vous allez :",
       options: ["Pouvoir facilement passer à une vitesse inférieure", "Ne plus pouvoir passer à une vitesse inférieure pour contrôler le véhicule", "Pouvoir dépasser des véhicules en toute sécurité"], correct: 1},

      {text: "Si un conducteur de véhicule lourd souhaite reculer, il doit se fier aux informations de :",
       options: ["Le rétroviseur uniquement", "Une autre personne qui l'assiste", "La caméra arrière uniquement"], correct: 1},

      {text: "Le conducteur d'un véhicule lourd doit faire attention à la hauteur de son véhicule surtout :",
       options: ["Lorsqu'il conduit sur des routes ouvertes", "Lorsqu'il passe sous un pont ou entre dans un tunnel", "Lorsqu'il traverse un pont"], correct: 1},

      {text: "La conduite d'un véhicule lourd diffère de celle d'un véhicule léger ; lorsque le conducteur d'un poids lourd tourne à droite :",
       options: ["Il ne doit pas laisser assez d'espace du côté droit", "Il doit laisser assez d'espace devant", "Il doit laisser assez d'espace du côté droit"], correct: 2},

      {text: "Lors du désaccouplement du tracteur de la remorque, le conducteur doit choisir un endroit :",
       options: ["Plat et mou", "En pente et mou", "En pente et solide"], correct: 0},

      {text: "Le nombre de passagers dans un camion chargé ne doit pas dépasser :",
       options: ["Une personne", "Le nombre indiqué sur le permis", "Il n'est pas autorisé de transporter des passagers"], correct: 1},

      {text: "Lorsque vous conduisez votre poids lourd dans un virage à droite, afin d'éviter que vos roues arrière droites ne quittent le bord de la route, vous devez :",
       options: ["Prendre votre extrême droite tout au long du virage", "Augmenter votre vitesse tout au long du virage", "Conduire au milieu de votre voie"], correct: 2},

      {text: "Si vous souhaitez dépasser un autre véhicule en montée avec votre poids lourd et que cela prendra beaucoup de temps, vous devez :",
       options: ["Insister pour effectuer le dépassement", "Augmenter votre vitesse au-delà de la limite légale", "Renoncer à ce dépassement"], correct: 2},

      {text: "Pour contrôler votre véhicule lorsque vous descendez une pente, vous devez principalement compter sur :",
       options: ["Les freins", "Le frein à main", "Un rapport inférieur"], correct: 2},

      {text: "Un conducteur de véhicule lourd a des angles morts autour de son véhicule, dont le nombre est :",
       options: ["Au moins quatre angles morts", "Au moins huit angles morts", "Trois angles morts"], correct: 0},

      {text: "Lorsque vous approchez du sommet d'une côte, vous devez vous attendre à trouver :",
       options: ["La présence d'obstacles", "Aucun obstacle", "Une route droite"], correct: 0},

      {text: "Après avoir attelé le tracteur à la remorque, le conducteur doit s'assurer que :",
       options: ["Les conduites d'air et les fils électriques sont bien connectés", "Seules les conduites d'air sont bien connectées", "Seuls les fils électriques sont bien connectés"], correct: 0},

      {text: "Lorsque vous conduisez votre poids lourd en montée continue, vous devez :",
       options: ["Vérifier le niveau de carburant", "Rester le plus à gauche possible", "Rester le plus à droite possible"], correct: 2},

      {text: "Le conducteur d'un véhicule lourd doit :",
       options: ["Reculer dans les endroits bondés", "Reculer immédiatement après une intersection", "Éviter de reculer dans les endroits bondés"], correct: 2},

      {text: "Lorsqu'il commence à atteler le tracteur à la remorque, le conducteur doit :",
       options: ["Reculer lentement le tracteur au-dessus de la remorque", "Reculer lentement le tracteur sous la remorque", "Reculer rapidement le tracteur sous la remorque"], correct: 1},

      {text: "Lorsque vous conduisez votre véhicule lourd en montée continue, vous devez :",
       options: ["Éviter de fatiguer le moteur", "Rester du côté gauche", "Ne pas laisser les véhicules légers vous dépasser"], correct: 0},

      {text: "L'utilisation continue des freins principaux sur une longue pente annule leur effet à cause de :",
       options: ["L'augmentation de leur température", "La pression du liquide de frein", "La raideur de la pente"], correct: 0},

      {text: "Tout conducteur de véhicule lourd doit prêter attention à la largeur de son véhicule surtout :",
       options: ["Lorsqu'il entre dans un endroit étroit", "Lorsqu'il prend une pause", "Lorsqu'il charge le véhicule"], correct: 0},

      {text: "Lors de l'attelage du tracteur à la remorque, le conducteur doit s'assurer que :",
       options: ["Les freins de la remorque sont serrés et ses pieds touchent le sol", "Les freins de la remorque sont relâchés et ses pieds touchent le sol", "La remorque touche le sol sur un seul pied"], correct: 0},

      {text: "Lorsque vous conduisez votre poids lourd dans un virage à gauche, afin d'éviter que vos roues arrière gauches ne franchissent la ligne médiane, vous devez :",
       options: ["Prendre votre extrême gauche tout au long du virage", "Prendre légèrement votre droite tout au long du virage", "Augmenter votre vitesse tout au long du virage"], correct: 0},

      {text: "Après avoir rempli la citerne, le conducteur doit s'assurer que :",
       options: ["Tous les couvercles de la citerne et les vannes de vidange sont bien fermés", "Seuls les couvercles de la citerne sont bien fermés", "Seules les vannes de vidange sont bien fermées"], correct: 0},

      {text: "La conduite d'un véhicule lourd sur une route accidentée vous oblige à :",
       options: ["Augmenter légèrement votre vitesse", "Être prudent et planifier la route à l'avance", "Concentrer votre attention vers l'arrière"], correct: 1},
       {text: "L'utilisation continue des freins principaux du camion sur une longue descente rend le frein inefficace :", options: ["Le frein, en raison de la surchauffe des garnitures de frein.", "La batterie, en raison d'une consommation excessive d'électricité.", "Le radiateur, en raison d'une chaleur excessive dans le moteur."], correct: 0},
{text: "Lorsque vous conduisez votre camion sur une longue descente, vous devez utiliser un rapport :", options: ["Élevé, avec les freins auxiliaires.", "Bas, avec les freins auxiliaires.", "Bas, avec le frein à main."], correct: 1},
{text: "Si vous abordez une longue descente avec le camion et que vous tardez à passer à un rapport bas, et que votre vitesse devient élevée, alors :", options: ["Il vous sera facile de passer à un rapport bas.", "Votre vitesse diminuera automatiquement.", "Il deviendra impossible de passer à un rapport bas pour contrôler le véhicule."], correct: 2},
{text: "Lorsque vous conduisez le camion en montée, vous devez choisir un rapport :", options: ["Bas, adapté à la raideur de la pente et au poids de la charge de votre véhicule.", "Élevé, adapté à la raideur de la pente mais pas au poids de la charge.", "Bas, non adapté à la raideur de la pente et au poids de la charge."], correct: 0},
{text: "Lorsque vous conduisez le camion en montée continue, vous devez :", options: ["Éviter de fatiguer le moteur.", "Maintenir la vitesse du camion autant que possible.", "Ne pas permettre aux petits véhicules de vous dépasser."], correct: 1},
{text: "Lorsque vous conduisez le camion en montée continue, vous devez :", options: ["Regarder l'indicateur de température la plupart du temps.", "Rester le plus à gauche possible.", "Rester le plus à droite possible."], correct: 2},
{text: "Lorsque vous conduisez le camion en montée, vous devez :", options: ["Faciliter la tâche des autres lorsqu'ils vous dépassent.", "Ne pas faciliter la tâche des autres lorsqu'ils vous dépassent.", "Klaxonner les autres lorsqu'ils vous dépassent."], correct: 0},
{text: "Si vous voulez dépasser un autre véhicule en montée avec votre camion, et que cela vous prendrait beaucoup de temps, vous devez :", options: ["Insister pour effectuer ce dépassement.", "Augmenter votre vitesse.", "Renoncer à ce dépassement."], correct: 2},
{text: "Conduire le camion sur une route accidentée exige que vous :", options: ["Augmentiez légèrement votre vitesse.", "Soyez prudent et planifiiez la route à l'avance.", "N'accordiez aucune importance à la chose."], correct: 1},
{text: "Un camion chargé ne peut pas transporter plus de :", options: ["Deux personnes.", "Une personne.", "Le nombre spécifié sur le permis."], correct: 2},
{text: "Chaque conducteur de camion doit faire attention à la largeur de son véhicule, en particulier :", options: ["Lorsqu'il dépasse un autre véhicule.", "Lorsqu'il conduit sur des routes ouvertes.", "Lorsqu'il prend du repos."], correct: 0},
{text: "Le conducteur du petit camion doit :", options: ["Reculer dans les endroits bondés.", "Reculer à l'intérieur d'un tunnel.", "Éviter de reculer dans les endroits bondés."], correct: 2},
{text: "Le conducteur du petit camion doit :", options: ["Connaître certaines caractéristiques de son véhicule.", "Connaître toutes les caractéristiques de son véhicule.", "Connaître les caractéristiques du véhicule de l'autre conducteur."], correct: 1},
{text: "Le danger pendant la conduite en approchant du sommet d'une côte réside dans :", options: ["Le fait de ne pas voir ce qui se passe au-delà du sommet.", "L'augmentation automatique de l'élan du véhicule.", "La baisse de la température du moteur."], correct: 0},
{text: "Lorsque vous approchez du sommet d'une côte à grande vitesse, vous devez :", options: ["Augmenter votre vitesse.", "Maintenir votre vitesse.", "Réduire votre vitesse."], correct: 2},
{text: "Lorsque vous approchez du sommet d'une côte, vous devez vous attendre, au-delà du sommet :", options: ["À la présence d'obstacles.", "À l'absence d'obstacles.", "À une décongestion de la circulation."], correct: 0},
{text: "Si vous utilisez le klaxon de façon continue en approchant du sommet d'une côte, cela :", options: ["Vous permettra d'entendre les klaxons des autres.", "Vous empêchera d'entendre les klaxons de ceux qui viennent de l'autre côté du sommet.", "Ne vous aidera en rien."], correct: 1},
{text: "Lorsque votre camion approche d'une descente à grande vitesse, vous devez réduire votre vitesse et :", options: ["Choisir un rapport supérieur.", "Rester dans le même rapport.", "Choisir un rapport inférieur."], correct: 2},
{text: "Lorsque vous conduisez votre camion sur une descente, pour contrôler votre véhicule vous devez compter sur :", options: ["Le frein de service et le frein de stationnement.", "Le rapport élevé en premier lieu.", "Le rapport bas en premier lieu."], correct: 2},
{text: "Pendant la conduite du camion sur diverses routes, vous devez :", options: ["Éviter les routes accidentées autant que possible.", "Choisir les routes accidentées car elles sont moins encombrées.", "Choisir les routes accidentées car elles ont un caractère naturel."], correct: 0},
{text: "Si le conducteur du véhicule doit reculer avec son véhicule, il doit :", options: ["Reculer à une vitesse de marche arrière modérée.", "Rendre la distance de recul la plus longue possible.", "Rendre la distance de recul la plus courte possible."], correct: 2},
{text: "En tant que conducteur de camion, la loi vous oblige à donner la priorité :", options: ["Aux véhicules rapides.", "Aux bus scolaires utilisant leurs feux de détresse.", "Aux véhicules lents."], correct: 1},
{text: "Les rétroviseurs convexes des véhicules montrent les objets :", options: ["À des distances plus éloignées qu'elles ne le sont réellement.", "À des distances plus proches qu'elles ne le sont réellement.", "De manière floue."], correct: 0},
{text: "Lorsque le conducteur du véhicule regarde dans le rétroviseur convexe, il y voit les objets :", options: ["À leur taille normale.", "En miniature.", "De manière pâle."], correct: 1},
{text: "Le conducteur du véhicule, s'il prend des médicaments, doit connaître l'ampleur de l'effet de ces médicaments sur la conduite, et cela :", options: ["Avant de conduire.", "Pendant la conduite.", "Après qu'un accident se soit produit."], correct: 0},
{text: "Certains médicaments ont un effet sédatif, c'est pourquoi le conducteur doit :", options: ["Les prendre au moment de terminer la conduite.", "Les prendre après avoir terminé la conduite.", "Ne pas les prendre."], correct: 1},
{text: "Le meilleur moyen pour un conducteur de connaître l'ampleur de l'effet d'un médicament sur sa conduite est de :", options: ["Demander à l'un des conducteurs.", "Demander au médecin traitant.", "Prendre le médicament et le tester en conduisant."], correct: 1},
{text: "Parmi les moyens qui aident le conducteur à connaître l'ampleur de l'effet d'un médicament sur sa conduite :", options: ["Prendre le médicament sans se référer à la notice jointe.", "Prendre le médicament avant de conduire et lire la notice après avoir conduit.", "Lire la notice jointe au médicament avant de prendre le médicament et avant de conduire."], correct: 2},
{text: "Le conducteur du véhicule peut connaître l'ampleur de l'effet causé par le médicament sur sa conduite en :", options: ["Demandant au pharmacien avant de commencer à conduire et avant de prendre le médicament.", "Demandant au pharmacien par téléphone pendant la conduite et après avoir pris le médicament.", "Le testant lui-même en prenant le médicament pendant la conduite."], correct: 0},
{text: "Chaque conducteur de camion doit faire attention à la largeur de son véhicule, en particulier :", options: ["Lorsqu'il entre dans un endroit étroit.", "Lorsqu'il conduit dans des endroits ouverts.", "Avant de décharger sa cargaison."], correct: 0},
{text: "Le conducteur du petit camion doit :", options: ["Reculer dans les endroits bondés.", "Reculer immédiatement après l'intersection.", "Éviter de reculer dans les endroits bondés."], correct: 2},
{text: "Le conducteur d'un véhicule chargé de réservoirs ou de barils, avant de commencer le trajet, doit s'assurer que :", options: ["Tous les couvercles des réservoirs ou des barils sont hermétiquement fermés.", "Certains couvercles des réservoirs sont hermétiquement fermés.", "Les réservoirs ou les barils sont pleins ou complètement vides et hermétiquement fermés."], correct: 2}
    ];

    const params = new URLSearchParams(window.location.search);
    let count = parseInt(params.get("count"), 10);
    if (isNaN(count) || count < 1) count = allQuestions.length;
    if (count > allQuestions.length) count = allQuestions.length;

    function shuffle(arr) {
      const c = [...arr];
      for (let i = c.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [c[i], c[j]] = [c[j], c[i]];
      }
      return c;
    }
    const selected = shuffle(allQuestions).slice(0, count);

    const area = document.getElementById("questionsArea");
    let score = 0;
    let answered = 0;

    document.getElementById("total").textContent = count;

    selected.forEach((q, i) => {
      const block = document.createElement("div");
      block.className = "question-block";

      block.innerHTML = `
        <p class="question-text"><strong>Question ${i + 1} :</strong> ${q.text}</p>
        <div class="options">
          ${q.options.map((opt, optIdx) => `
            <button class="option" data-q="${i}" data-opt="${optIdx}">${opt}</button>
          `).join("")}
        </div>
      `;

      area.appendChild(block);
    });

    area.addEventListener("click", (e) => {
      const btn = e.target.closest(".option");
      if (!btn) return;

      const qIndex = parseInt(btn.dataset.q, 10);
      const optIndex = parseInt(btn.dataset.opt, 10);
      const question = selected[qIndex];

      const block = btn.closest(".question-block");
      if (block.classList.contains("answered")) return;
      block.classList.add("answered");

      const buttons = block.querySelectorAll(".option");
      buttons[question.correct].classList.add("correct");

      if (optIndex !== question.correct) {
        btn.classList.add("wrong");
      } else {
        score++;
      }

      answered++;
      buttons.forEach(b => b.disabled = true);
      document.getElementById("score").textContent = score;

      if (answered === count) {
        showFinalResult();
      }
    });

    function showFinalResult() {
      const box = document.getElementById("finalResult");
      const pct = Math.round((score / count) * 100);
      box.innerHTML = `
        <i class="fas fa-trophy"></i>
        Votre score final : <strong>${score} / ${count}</strong> (${pct}%)
      `;
      box.classList.add("visible");
      box.scrollIntoView({ behavior: "smooth", block: "center" });
    }

  // ============ CUSTOM CONFIRM ============
const modal = document.getElementById("confirmModal");
const modalMsg = document.getElementById("confirmMessage");
const confirmYes = document.getElementById("confirmYes");
const confirmNo = document.getElementById("confirmNo");

function showConfirm(message, onYes) {
  modalMsg.textContent = message;
  modal.classList.add("visible");

  // Remove old listeners
  const newYes = confirmYes.cloneNode(true);
  const newNo = confirmNo.cloneNode(true);
  confirmYes.parentNode.replaceChild(newYes, confirmYes);
  confirmNo.parentNode.replaceChild(newNo, confirmNo);

  newYes.addEventListener("click", () => {
    modal.classList.remove("visible");
    onYes();
  });

  newNo.addEventListener("click", () => {
    modal.classList.remove("visible");
  });
}

// ============ SUBMIT BUTTON ============
document.getElementById("submitBtn").addEventListener("click", () => {
  if (answered < count) {
    showConfirm(
      `Vous avez répondu à ${answered} sur ${count} questions. Voulez-vous terminer le test ?`,
      showFinalResult
    );
  } else {
    showFinalResult();
  }
});
    const scrollBtn = document.getElementById("scrollTopBtn");

    window.addEventListener("scroll", () => {
      if (window.scrollY > 300) {
        scrollBtn.classList.add("visible");
      } else {
        scrollBtn.classList.remove("visible");
      }
    });

    scrollBtn.addEventListener("click", () => {
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  </script>
<style>
    .question-text{
        text-align: left;  
    }
    .option{
        text-align: left;  
    }
</style>
</body>
</html>
