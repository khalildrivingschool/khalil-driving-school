      {text: "ي صدر قرارات تصنيف الطرق العامة:",
       options: ["وزير الداخلية والبلديات", "رئيس الوزراء", "وزير الأشغال العامة والنقل"], correct: 2},

      {text: "عند وجود اشارة ضوئية وشرطي يتقيد مستخدم الطريق ب:",
       options: ["الاشارة الضوئية", "إشارة الشرطي اليدوية", "قواعد افساح المرور"], correct: 1},

      {text: "يتم إفساح المرور في المستديرات لسائق المركبة التي:",
       options: ["تدخل المستديرة", "سرعتها اعلى من باقي السيارات المقتربة من المستديرة", "داخل المستديرة"], correct: 2},

      {text: "يعاقب قانون السير على \"الوقوف المتمادي\" للمركبات التي لا تتحرك من مكان وقوفها لمدة تزيد عن:",
       options: ["15 يوم", "20 يوم", "30 يوماً وما فوق"], correct: 2},

      {text: "عندما لا يلتزم راكب قاصر بوضع حزام الأمان تعتبر المخالفة من مسؤولية:",
       options: ["سائق المركبة", "والدي الراكب", "صاحب العلاقة"], correct: 0},

      {text: "يوضع الملصق التعريفي الدعائي للسيارة العمومية على:",
       options: ["على جانبيّ المركبة", "قرب لوحات السير للمركبة", "غطاء المحرك وغطاء الصندوق"], correct: 0},

      {text: "تضاء لوحة \"إجرة\" أو TAXI الموضوعة على سطح سيارة الإجرة:",
       options: ["عند فراغها من الركّاب", "عند تجول السيارة", "فقط في الليل"], correct: 0},

      {text: "يسمح للسائق العمومي بتلازم السير بموازاة سيارة أخرى:",
       options: ["في الأماكن غير السكنية", "لا يسمح", "في الطرقات الداخلية"], correct: 1},

       options: ["في البلدات النائية", "لا يسمح", "خارج مراكز الاقضية والمحافظات"], correct: 1},

       options: ["عند وجود اطفال بعد اذن الأهل", "في كل الأوقات", "عند وجود اطفال بدون اذن الأهل"], correct: 0},

      {text: "يخضع نقل السلاح الحربي او سلاح الصيد:",
       options: ["للترخيص من المراجع الأمنية المختصة", "للترخيص من البلديات", "للترخيص إذا تجاوز عدده قطعتين"], correct: 0},

      {text: "يرتبط القيام بحديث شخصي بين السائقين العموميين والركاب:",
       options: ["برغبة الركاب", "برغبة السائق", "كل ما ورد أعلاه"], correct: 2},

      {text: "على السائق العمومي توضيح التعرفة للراكب:",
       options: ["قبل دخوله المركبة", "بعد دخوله المركبة", "فقط عند السؤال"], correct: 0},
    ];

    const params = new URLSearchParams(window.location.search);
    let count = parseInt(params.get("count"), 10);
    if (isNaN(count) || count < 1) count = allQuestions.length;
    if (count > allQuestions.length) count = allQuestions.length;

    function shuffle(arr) {
      const c = [...arr];
      for (let i = c.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [c[i], c[j]] = [c[j], c[i]];
      }
      return c;
    }
    const selected = shuffle(allQuestions).slice(0, count);

    const area = document.getElementById("questionsArea");
    let score = 0;
    let answered = 0;

    document.getElementById("total").textContent = count;

    selected.forEach((q, i) => {
      const block = document.createElement("div");
      block.className = "question-block";

      block.innerHTML = `
        <p class="question-text"><strong>سؤال ${i + 1}:</strong> ${q.text}</p>
        <div class="options">
          ${q.options.map((opt, optIdx) => `
            <button class="option" data-q="${i}" data-opt="${optIdx}">${opt}</button>
          `).join("")}
        </div>
      `;

      area.appendChild(block);
    });

    area.addEventListener("click", (e) => {
      const btn = e.target.closest(".option");
      if (!btn) return;

      const qIndex = parseInt(btn.dataset.q, 10);
      const optIndex = parseInt(btn.dataset.opt, 10);
      const question = selected[qIndex];

      const block = btn.closest(".question-block");
      if (block.classList.contains("answered")) return;
      block.classList.add("answered");

      const buttons = block.querySelectorAll(".option");
      buttons[question.correct].classList.add("correct");

      if (optIndex !== question.correct) {
        btn.classList.add("wrong");
      } else {
        score++;
      }

      answered++;
      buttons.forEach(b => b.disabled = true);
      document.getElementById("score").textContent = score;

      if (answered === count) {
        showFinalResult();
      }
    });

    function showFinalResult() {
      const box = document.getElementById("finalResult");
      const pct = Math.round((score / count) * 100);
      box.innerHTML = `
        <i class="fas fa-trophy"></i>
        نتيجتك النهائية: <strong>${score} / ${count}</strong> (${pct}%)
      `;
      box.classList.add("visible");
      box.scrollIntoView({ behavior: "smooth", block: "center" });
    }

    // ============ SUBMIT BUTTON ============
// ============ CUSTOM CONFIRM ============
const modal = document.getElementById("confirmModal");
const modalMsg = document.getElementById("confirmMessage");
const confirmYes = document.getElementById("confirmYes");
const confirmNo = document.getElementById("confirmNo");

function showConfirm(message, onYes) {
  modalMsg.textContent = message;
  modal.classList.add("visible");

  // Remove old listeners
  const newYes = confirmYes.cloneNode(true);
  const newNo = confirmNo.cloneNode(true);
  confirmYes.parentNode.replaceChild(newYes, confirmYes);
  confirmNo.parentNode.replaceChild(newNo, confirmNo);

  newYes.addEventListener("click", () => {
    modal.classList.remove("visible");
    onYes();
  });

  newNo.addEventListener("click", () => {
    modal.classList.remove("visible");
  });
}

// ============ SUBMIT BUTTON ============
// ============ CUSTOM CONFIRM ============

// ============ SUBMIT BUTTON ============
document.getElementById("submitBtn").addEventListener("click", () => {
  if (answered < count) {
    showConfirm(
      `لقد أجبت على ${answered} من ${count} سؤال. هل تريد إنهاء الاختبار؟`,
      showFinalResult
    );
  } else {
    showFinalResult();
  }
});

    const scrollBtn = document.getElementById("scrollTopBtn");

    window.addEventListener("scroll", () => {
      if (window.scrollY > 300) {
        scrollBtn.classList.add("visible");
      } else {
        scrollBtn.classList.remove("visible");
      }
    });

    scrollBtn.addEventListener("click", () => {
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  </script>
