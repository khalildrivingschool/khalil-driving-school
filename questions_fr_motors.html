</div>
  <script>
    const allQuestions = [
      {text: "Pour éviter un accident à moto aux intersections, vous devez :",
       options: ["Ralentir et prendre la bonne voie", "Accélérer pour traverser rapidement", "Passer à droite des véhicules arrêtés à l'intersection"], correct: 0},

      {text: "Pour ne pas augmenter la vitesse par erreur pendant la conduite, vous devez tenir le guidon de la moto de sorte que votre poignet soit :",
       options: ["Le droit vers le haut", "Le gauche vers le haut", "Le droit vers le bas"], correct: 2},

      {text: "La protection réelle du motard est assurée par :",
       options: ["Le port de vêtements spéciaux pour motards", "La conduite sur la roue arrière uniquement", "S'assurer que la moto est assurée"], correct: 0},

      {text: "Le casque de protection pour motards assure une protection au conducteur pour :",
       options: ["L'ouïe contre le bruit de la circulation", "La tête contre les blessures mortelles", "La colonne vertébrale"], correct: 1},

      {text: "Parmi les causes de renversement d'une moto, il y a :",
       options: ["De l'huile et du gravier sur la chaussée", "Des voitures et des piétons sur la route", "La police et les feux de circulation sur la route"], correct: 0},

      {text: "Pour éviter de déraper en utilisant les freins de la moto, celle-ci doit rouler :",
       options: ["Dans un virage", "À grande vitesse", "En ligne droite"], correct: 2},

      {text: "En tant que motard, vous avez le droit de dépasser le véhicule devant vous :",
       options: ["Par sa droite", "Par sa gauche", "De n'importe quel côté"], correct: 1},

      {text: "Le port de gants spéciaux pour moto offre au conducteur :",
       options: ["Une protection de la tête en cas de chute", "Une protection des mains contre les blessures et le froid", "Une protection des pieds en cas de chute"], correct: 1},

      {text: "Le simple fait de porter le casque à la main sans le mettre et l'attacher correctement en conduisant :",
       options: ["Exempte le conducteur de toute responsabilité légale", "N'exempte pas le conducteur de toute responsabilité légale", "Est un acte logique du conducteur"], correct: 1},

      {text: "Habituellement, la raison du \"louvoiement\" à moto en roulant est :",
       options: ["La déformation d'au moins une roue ou un pneu", "La rotation des deux roues sur le même axe", "Une mauvaise répartition de la charge"], correct: 0},

      {text: "Lorsque vous dépassez à gauche un véhicule devant vous, sachez qu'il peut :",
       options: ["Ralentir progressivement", "Tourner soudainement à gauche", "Allumer ses feux de détresse"], correct: 1},

      {text: "Si la moto est équipée d'un système de freinage hydraulique, il faut périodiquement :",
       options: ["Vérifier le niveau de liquide de frein", "Réduire l'utilisation des freins", "Régler la tension du câble de frein"], correct: 0},

      {text: "Il est conseillé au motard la nuit, afin d'être vu par les autres, de :",
       options: ["Porter des bandes ou signes réfléchissants", "Éteindre les feux et porter des signes réfléchissants", "Faire grincer les freins"], correct: 0},

      {text: "Le port d'un protège-dos spécial moto assure une protection :",
       options: ["De la poitrine et de l'abdomen contre la chaleur et le froid", "De la colonne vertébrale et de la moelle épinière contre la pluie", "De la colonne vertébrale et de la moelle épinière contre les blessures"], correct: 2},

      {text: "Pendant la conduite de nuit, le motard doit porter :",
       options: ["Des vêtements sombres ordinaires", "Une combinaison fluorescente spéciale", "Des vêtements de sport"], correct: 1},

      {text: "Le fait de porter des bottes spéciales motards offre une protection pour :",
       options: ["Le genou et la cuisse contre l'eau et le froid", "Le genou et la cuisse contre l'eau et le froid", "Les pieds et le tibia contre les blessures, l'eau et le froid"], correct: 2},

      {text: "La profondeur minimale de sculpture sur un pneu de moto ne doit pas être inférieure à :",
       options: ["5 millimètres", "3 millimètres", "6 millimètres"], correct: 1},

      {text: "Lorsque vous conduisez votre moto en zigzagant entre les véhicules, cela :",
       options: ["Augmente le risque d'être impliqué dans un accident", "Diminue le risque d'être impliqué dans un accident", "Fait de vous un conducteur prudent"], correct: 0},

      {text: "Pour qu'un motard puisse diriger le guidon sans difficulté, il doit :",
       options: ["S'asseoir loin du guidon", "S'asseoir près du guidon", "Tenir le guidon avec une seule main"], correct: 1},

      {text: "Le freinage est le plus efficace quand le motard utilise :",
       options: ["Le frein arrière uniquement", "Les freins arrière et avant ensemble", "Son pied appuyé sur l'asphalte"], correct: 1},

      {text: "Lorsque vous conduisez votre moto avec un échappement volontairement ouvert et très bruyant, cela :",
       options: ["Montre que vous avez des idées créatives", "Est considéré comme une infraction claire", "Est légalement autorisé"], correct: 1},

      {text: "Les combinaisons en cuir pour motards ont la capacité de résister :",
       options: ["À la conduite rapide entre les véhicules", "À la friction avec le gravier et l'asphalte", "Au feu"], correct: 1},

      {text: "Ne pas porter de casque en roulant, ou le porter partiellement ou pas du tout attaché :",
       options: ["Est considéré comme une infraction légale", "Est considéré comme un acte légal", "Est considéré comme un acte normal"], correct: 0},

      {text: "Le port de lunettes de protection spéciales pour motards offre une protection pour :",
       options: ["Les oreilles contre le froid", "Les yeux contre le vent, le sable, la pluie et les insectes", "Les yeux contre les larmes"], correct: 1},

      {text: "Lorsque vous conduisez votre moto la nuit, vous devez :",
       options: ["Ralentir et laisser une distance d'arrêt plus courte", "Ralentir et laisser une distance d'arrêt plus longue", "Accélérer et utiliser les feux de croisement"], correct: 1},

      {text: "Il y a deux raisons principales qui provoquent le glissement d'une moto en roulant :",
       options: ["Un moteur rapide et un guidon élevé", "Une chaussée glissante et une réaction nerveuse", "Une vitesse basse et un rapport de vitesse bas"], correct: 1},

      {text: "Lorsque vous conduisez votre moto en ligne droite, faites attention qu'un véhicule en sens inverse peut :",
       options: ["Tourner soudainement dans votre trajectoire", "S'arrêter soudainement dans sa trajectoire", "Tourner brusquement loin de votre trajectoire"], correct: 0},
     {text: "Quelle est la raison principale qui rend l'entretien régulier de votre moto nécessaire ?", options: ["Permettre à la moto de transporter des sacs", "Rendre la moto plus rapide que les autres véhicules", "Maintenir la moto en état de circuler"], correct: 2},
{text: "Vous conduisez votre moto sur une route de campagne. Que faites-vous si vous rencontrez du bétail qui utilise la route ?", options: ["Vous leur laissez un espace suffisant", "Vous vous en approchez pour les forcer à libérer le passage", "Vous klaxonnez"], correct: 0},
{text: "Vous êtes motocycliste et vous approchez d'une intersection à votre droite ; une voiture apparaît également et approche de la même intersection. Que faites-vous ?", options: ["Vous ralentissez et attendez le signal de la voiture", "Vous accélérez pour traverser l'intersection sans délai", "Vous vous arrêtez, car la voiture a la priorité"], correct: 2},
{text: "Votre moto est garée sur une route à double sens. Comment montez-vous sur la moto ?", options: ["Par la gauche, et vous actionnez le frein avant", "Par la droite, et vous relâchez le frein arrière", "Par la droite, et vous laissez les freins"], correct: 1},
{text: "Vous conduisez votre moto en ville la nuit. Les routes sont mouillées après la pluie. Comment les reflets sur les surfaces mouillées vous affecteront-ils ?", options: ["Ils faciliteront la vision des objets non éclairés", "Ils faciliteront le freinage", "Ils rendront plus difficile la vision des objets non éclairés"], correct: 2},
{text: "Vous avez froid en conduisant votre moto. Comment cela vous affectera-t-il ?", options: ["Vous serez plus vigilant", "Vous perdrez votre concentration", "Vous réagirez plus rapidement"], correct: 1},
{text: "Vous conduisez votre moto la nuit et les phares d'un véhicule venant en sens inverse vous éblouissent. Que devez-vous faire ?", options: ["Ralentir et vous arrêter si nécessaire", "Éteindre vos phares avant", "Utiliser les feux de route"], correct: 0},
{text: "Votre moto n'a pas de freins couplés. En cas d'urgence, que devez-vous faire pour vous arrêter rapidement ?", options: ["Actionner le frein avant immédiatement avant le frein arrière", "Actionner le frein arrière immédiatement avant le frein avant", "Actionner uniquement le frein arrière"], correct: 0},
{text: "Lequel des éléments suivants peut nécessiter un réglage lorsqu'on transporte un passager ?", options: ["L'échappement", "Les phares avant", "Les clignotants"], correct: 1},
{text: "Quelle surface de route a le plus grand effet sur la perte de stabilité de votre moto ?", options: ["Le gravier non compacté", "Le ciment (béton)", "L'asphalte"], correct: 0},
{text: "Quand êtes-vous autorisé à vous arrêter sur le bas-côté de l'autoroute ?", options: ["Si vous vous sentez fatigué et avez besoin de repos", "Si vous avez dépassé la sortie", "Uniquement en cas d'urgence"], correct: 2},
{text: "Où les usagers de la route doivent-ils être particulièrement prudents pour surveiller les motocyclistes et les autres véhicules ?", options: ["Aux intersections", "Aux passages piétons", "Sur les routes à double sens"], correct: 0},
{text: "Comment ajuste-t-on la chaîne de transmission finale ?", options: ["Desserrer le boulon de l'axe arrière et le serrer à la position appropriée", "Desserrer le boulon du moteur et le serrer à la position appropriée", "Les deux réponses précédentes sont correctes"], correct: 0},
{text: "Vous avez réglé la chaîne de transmission de manière incorrecte. Quel problème peut survenir ?", options: ["Lecture inexacte du compteur de vitesse", "Alignement incorrect de la roue arrière", "Perte de puissance de freinage"], correct: 1},
{text: "Vous devez gonfler les pneus de votre moto. Comment pouvez-vous connaître la pression correcte ?", options: ["En vérifiant le manuel d'utilisation de la moto", "Elle est indiquée sur le flanc du pneu", "Elle est gravée sur la roue"], correct: 0},
{text: "Vous transportez un passager dans le side-car. Que devez-vous ajuster pour tenir compte du poids supplémentaire ?", options: ["L'équilibre des roues avant et arrière", "La précharge sur la fourche avant", "La précharge sur l'amortisseur arrière"], correct: 2},
{text: "Pourquoi devez-vous regarder par-dessus votre épaule avant de tourner à gauche sur une route secondaire ?", options: ["Pour vérifier la présence de circulation venant en sens inverse", "Pour vérifier qu'aucun véhicule ne vous dépasse", "Pour vous assurer que la route secondaire est libre"], correct: 1},
{text: "Quelles mesures préventives pouvez-vous prendre pour protéger votre moto du risque d'incendie ?", options: ["Éviter de rouler avec un réservoir de carburant plein", "Vérifier l'absence d'une forte odeur de carburant (essence)", "Utiliser de l'essence sans plomb"], correct: 1},
{text: "Vous tournez à gauche pour sortir d'une route à double sens vers une route à double sens. Que devez-vous faire avant de sortir ?", options: ["Vérifier la largeur du terre-plein central", "Rester sur le côté gauche de la voie", "Vous arrêter, puis sélectionner un rapport très bas"], correct: 0},
{text: "Qu'est-ce qui rend votre moto plus visible à la lumière du jour ?", options: ["Porter un casque noir", "Porter une veste sombre", "Porter une veste de couleur claire"], correct: 2},
{text: "Que devez-vous vérifier après avoir terminé de serrer la chaîne de transmission ?", options: ["L'alignement de la roue arrière", "La pression du pneu arrière", "L'état de l'amortisseur arrière"], correct: 0},
{text: "Vous avez eu une collision avec un véhicule, une personne a été blessée et votre moto a été endommagée. Que devez-vous savoir ?", options: ["Les détails de l'assurance du véhicule précédent", "Si le conducteur est le propriétaire du véhicule", "Si le conducteur est autorisé à conduire"], correct: 0},
{text: "Que faites-vous lorsque vous rencontrez un obstacle de votre côté de la route ?", options: ["Vous augmentez votre vitesse pour passer en premier", "Vous continuez, vous avez la priorité", "Vous cédez le passage aux véhicules venant en sens inverse"], correct: 2},
{text: "Vous venez de traverser de l'eau profonde. Que devez-vous faire pour vous assurer que vos freins fonctionnent correctement ?", options: ["Éviter complètement d'utiliser les freins sur des kilomètres", "Rouler lentement en appuyant doucement sur les freins", "Vous arrêter pendant au moins une heure pour leur laisser le temps de sécher"], correct: 1},
{text: "Certaines routes à double sens sont divisées en trois voies. Pourquoi ces routes sont-elles considérées comme particulièrement dangereuses ?", options: ["Parce que les véhicules peuvent dépasser par la droite", "Parce que la voie du milieu est autorisée pour le dépassement dans les deux sens", "Parce que la voie du milieu n'est utilisée qu'en cas d'urgence"], correct: 1},
{text: "Avant de commencer le trajet, il est sage de planifier l'itinéraire. Comment pouvez-vous le faire ?", options: ["Contacter des ateliers de réparation à proximité le long de l'itinéraire", "Consulter la carte", "Consulter le manuel d'utilisation de votre moto"], correct: 1},
{text: "L'équipement de protection individuelle du motocycliste et de son passager se compose de :", options: ["Casque et gants", "Casque, veste, pantalon et bottes", "Casque, gants et bottes"], correct: 1},
{text: "Vous arrivez sur les lieux d'un accident. Une personne saigne abondamment d'une blessure au bras et rien n'y est incrusté. Que devez-vous faire ?", options: ["Appuyer sur la blessure et garder le bras baissé", "Appuyer sur la blessure et soulever le bras", "Laisser la blessure saigner"], correct: 1},
{text: "En cas d'accident, la personne blessée ne respire pas. Que devez-vous faire en l'aidant à retrouver sa respiration ?", options: ["La tourner sur le côté", "La secouer vigoureusement", "Incliner sa tête en arrière et soulever la mâchoire"], correct: 2},
{text: "Une collision s'est produite. Le motocycliste est blessé et inconscient. Pourquoi ne faut-il généralement pas retirer son casque, sauf en cas de nécessité absolue ?", options: ["Il pourrait ne pas le vouloir", "Cela pourrait entraîner une blessure plus grave", "Il pourrait être exposé à une chaleur ou un froid extrême"], correct: 1},
{text: "Un conducteur novice commence à s'insérer dans votre voie depuis une route secondaire sur la droite. Que faites-vous ?", options: ["Vous vous préparez à ralentir et à vous arrêter", "Vous le laissez entrer, puis vous roulez directement derrière lui", "Vous tournez sur la route secondaire"], correct: 0},
{text: "Un conducteur novice conduit le véhicule devant vous. Que faites-vous ?", options: ["Vous restez calme et patient", "Vous accélérez", "Vous klaxonnez"], correct: 0},
{text: "Vous transportez un chargement sur le porte-bagages de votre moto. Que devez-vous vous assurer ?", options: ["Que le chargement est couvert d'une housse en plastique", "Que le chargement est clairement visible", "Que le chargement est solidement fixé"], correct: 2},
{text: "Vous venez de traverser de l'eau profonde. Que devez-vous vérifier après vous être éloigné de l'eau ?", options: ["Les freins", "Les feux avant", "La direction"], correct: 0},
{text: "Il a plu après une longue période de chaleur et de sécheresse. Comment cela affecte-t-il la surface de la route ?", options: ["Elle peut se couvrir de gravier", "Elle peut devenir anormalement glissante", "La surface de la route peut se fissurer et se briser"], correct: 1},
{text: "Lors d'un virage, que doit faire le passager arrière ?", options: ["Donner des signaux de direction avec ses bras à votre place", "Se pencher sur le côté pour voir devant", "Se pencher avec vous dans les virages"], correct: 2},
{text: "Qu'est-ce qu'une charge lourde dans le top-case de la moto peut causer ?", options: ["Un meilleur freinage", "Un meilleur équilibre de la moto", "Une réduction de l'équilibre de la moto"], correct: 2},
{text: "Dans des conditions de conduite normales, comment devez-vous utiliser les freins ?", options: ["Utiliser d'abord le frein arrière, puis l'avant", "Lorsque vous tournez la moto ou que vous la conduisez dans une courbe", "Lorsque la moto va tout droit et se déplace en ligne droite"], correct: 2},
{text: "Lequel des éléments suivants résulte de la consommation d'alcool ?", options: ["Des réactions plus rapides", "Une concentration accrue", "Une altération du jugement"], correct: 2},
{text: "Votre moto est équipée d'un \"pot catalytique\" (catalytic converter). Que réduit-il ?", options: ["Le bruit du moteur", "Les émissions générales", "Le bruit de l'échappement"], correct: 1},
{text: "Vous avez attendu un certain temps pour tourner à gauche sur une route secondaire. Que devez-vous faire juste avant de tourner ?", options: ["Regarder à droite et à gauche - un coup d'œil qui sauve une vie", "Vous approcher du trottoir", "Faire signe à la circulation venant en sens inverse"], correct: 0},
{text: "Quand devez-vous augmenter la pression des pneus de votre moto ?", options: ["Lorsque vous transportez une charge lourde", "Lorsque vous roulez par temps chaud", "Lorsque vous roulez par temps pluvieux"], correct: 0},
{text: "Comment entretenez-vous les freins à câble ?", options: ["En les vérifiant à température normale de fonctionnement", "En les lubrifiant et en les réglant régulièrement", "En éliminant tout jeu libre du levier ou de la pédale"], correct: 1},
{text: "La distance d'arrêt totale se compose de la distance de réflexion et de la distance de freinage. Vous êtes sur une route sèche et en bon état, avec de bons freins et pneus. Quelle est la distance de freinage typique à 75 km/h ?", options: ["24 mètres", "38 mètres", "55 mètres"], correct: 1},
{text: "Vous n'êtes pas sûr qu'un sirop contre la toux affecte votre capacité à conduire en toute sécurité. Que faites-vous ?", options: ["Vous consultez un ami ou un proche", "Vous consultez votre médecin ou votre pharmacien", "Vous ne prenez pas le médicament"], correct: 1},
{text: "Pourquoi les jeunes motocyclistes sont-ils plus susceptibles d'être impliqués dans des accidents ?", options: ["Parce qu'ils roulent en groupe", "Parce qu'ils manquent d'expérience", "Parce qu'ils sont très prudents aux intersections"], correct: 1},
{text: "Vous êtes sur une route à sens unique et vous voulez tourner à gauche. Il y a deux voies. Dans quelle voie devez-vous placer votre moto ?", options: ["Dans la voie de gauche", "Dans la voie de droite", "Juste à droite de la ligne médiane"], correct: 0},
{text: "Un conducteur a déboîté d'une route secondaire devant vous, vous forçant à freiner brusquement. Que devez-vous faire ?", options: ["Allumer vos feux de route pour montrer votre mécontentement", "Ignorer l'erreur et rester calme", "Klaxonner pour montrer votre mécontentement"], correct: 1},
{text: "Que faites-vous lorsque vous voyez deux piétons âgés sur le point de traverser la route devant vous ?", options: ["Être prudent ; ils pourraient mal évaluer votre vitesse", "Vous attendre à ce qu'ils vous laissent passer", "Accélérer pour les dépasser rapidement"], correct: 0},
{text: "Quel est l'usager de la route le plus vulnérable aux intersections ?", options: ["Un conducteur de voiture", "Un conducteur de camion", "Un motocycliste"], correct: 2},
{text: "Vous approchez d'un rond-point. Il y a des chevaux juste devant vous. Que faites-vous ?", options: ["Vous leur laissez un espace suffisant", "Vous klaxonnez comme avertissement", "Vous les traitez comme tout autre véhicule"], correct: 0},
{text: "Vous suivez un camion sur une route mouillée. Que faites-vous lorsque les projections rendent la visibilité de la route difficile devant vous ?", options: ["Vous augmentez la distance entre vous et lui pour améliorer la visibilité", "Vous restez près du camion, à l'abri des projections", "Vous allumez vos phares avant au maximum"], correct: 0},
{text: "Vous maintenez une longue distance de suivi en attendant de dépasser un gros véhicule. Que faites-vous si une voiture s'insère dans cet espace ?", options: ["Vous ralentissez pour rétablir une distance de suivi sûre", "Vous allumez vos feux de route", "Vous klaxonnez"], correct: 0},
{text: "Vous suivez un gros véhicule. Pourquoi devez-vous maintenir une distance de suivi sûre derrière lui ?", options: ["Parce que vous permettrez au conducteur de vous voir dans son rétroviseur", "Parce que vous pourrez tourner plus rapidement", "Parce que vous aiderez le gros véhicule à s'arrêter plus facilement"], correct: 0},
{text: "Le conducteur du véhicule devant vous va tout droit et vous pensez qu'il a oublié d'annuler son clignotant gauche. Que faites-vous ?", options: ["Vous allumez vos feux pour alerter le conducteur", "Vous le dépassez par la droite si possible", "Vous restez derrière lui et ne le dépassez pas"], correct: 1},
{text: "Vous suivez un véhicule à une distance sûre sur une route mouillée. Un autre conducteur vous dépasse et s'insère dans la distance de suivi que vous avez laissée devant vous. Que faites-vous ?", options: ["Vous ralentissez pour rétablir une distance de suivi sûre", "Vous allumez vos phares avant comme avertissement", "Vous essayez de dépasser à la première opportunité sûre"], correct: 0},
{text: "Une personne blessée a été placée en position latérale de sécurité. Elle est inconsciente mais respire normalement. Que faut-il faire d'autre ?", options: ["S'assurer que les voies respiratoires sont dégagées", "Placer ses bras le long du corps", "Appuyer fortement entre ses épaules"], correct: 0},
{text: "Vous êtes le premier à arriver sur les lieux d'un accident où des personnes sont gravement blessées. Vous avez allumé les feux de détresse et vous êtes assuré que tous les moteurs sont coupés. Que faites-vous d'autre ?", options: ["Vous vous assurez qu'une ambulance a été appelée", "Vous éloignez les blessés de leurs véhicules", "Vous arrêtez les autres véhicules et demandez l'aide de leurs conducteurs"], correct: 0},
{text: "Un accident s'est produit, une personne souffre de brûlures graves. Que pouvez-vous faire pour l'aider ?", options: ["Appliquer une pommade sur la blessure", "Laver les brûlures avec un liquide propre, frais et stérile", "Retirer tout objet collé aux brûlures"], correct: 1},
{text: "Une collision vient de se produire. Une personne blessée est allongée sur une route fréquentée. Quelle est la première chose à faire pour l'aider ?", options: ["Vous assurer que la personne blessée reste au chaud", "Traiter la personne blessée pour le choc", "Avertir les autres usagers de la circulation"], correct: 2},

{text: "Le freinage pendant la pluie se fait :", options: ["En se fiant au frein arrière", "En se fiant au frein avant", "En actionnant ensemble et avec précaution les freins arrière et avant"], correct: 2},

{text: "Vous ne devez pas faire le plein pendant que le moteur tourne :", options: ["Pour éviter que la moto ne prenne feu en raison de la proximité du réservoir de carburant avec le moteur", "Pour éviter que la moto ne prenne feu en raison de la proximité du réservoir de carburant avec le public", "Les deux réponses précédentes"], correct: 0},
{text: "Vous ne devez pas arrêter la moto à côté d'un véhicule en attendant dans la circulation :", options: ["Pour éviter que la moto ne disparaisse dans l'angle mort du conducteur du véhicule", "Pour éviter que la moto n'enfreigne le dégagement latéral légal qui doit être supérieur à 75 cm", "Les deux réponses précédentes"], correct: 2}
    ];

    const params = new URLSearchParams(window.location.search);
    let count = parseInt(params.get("count"), 10);
    if (isNaN(count) || count < 1) count = allQuestions.length;
    if (count > allQuestions.length) count = allQuestions.length;

    function shuffle(arr) {
      const c = [...arr];
      for (let i = c.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [c[i], c[j]] = [c[j], c[i]];
      }
      return c;
    }
    const selected = shuffle(allQuestions).slice(0, count);

    const area = document.getElementById("questionsArea");
    let score = 0;
    let answered = 0;

    document.getElementById("total").textContent = count;

    selected.forEach((q, i) => {
      const block = document.createElement("div");
      block.className = "question-block";

      block.innerHTML = `
        <p class="question-text"><strong>Question ${i + 1} :</strong> ${q.text}</p>
        <div class="options">
          ${q.options.map((opt, optIdx) => `
            <button class="option" data-q="${i}" data-opt="${optIdx}">${opt}</button>
          `).join("")}
        </div>
      `;

      area.appendChild(block);
    });

    area.addEventListener("click", (e) => {
      const btn = e.target.closest(".option");
      if (!btn) return;

      const qIndex = parseInt(btn.dataset.q, 10);
      const optIndex = parseInt(btn.dataset.opt, 10);
      const question = selected[qIndex];

      const block = btn.closest(".question-block");
      if (block.classList.contains("answered")) return;
      block.classList.add("answered");

      const buttons = block.querySelectorAll(".option");
      buttons[question.correct].classList.add("correct");

      if (optIndex !== question.correct) {
        btn.classList.add("wrong");
      } else {
        score++;
      }

      answered++;
      buttons.forEach(b => b.disabled = true);
      document.getElementById("score").textContent = score;

      if (answered === count) {
        showFinalResult();
      }
    });

    function showFinalResult() {
      const box = document.getElementById("finalResult");
      const pct = Math.round((score / count) * 100);
      box.innerHTML = `
        <i class="fas fa-trophy"></i>
        Votre score final : <strong>${score} / ${count}</strong> (${pct}%)
      `;
      box.classList.add("visible");
      box.scrollIntoView({ behavior: "smooth", block: "center" });
    }

// ============ CUSTOM CONFIRM ============
const modal = document.getElementById("confirmModal");
const modalMsg = document.getElementById("confirmMessage");
const confirmYes = document.getElementById("confirmYes");
const confirmNo = document.getElementById("confirmNo");

function showConfirm(message, onYes) {
  modalMsg.textContent = message;
  modal.classList.add("visible");

  // Remove old listeners
  const newYes = confirmYes.cloneNode(true);
  const newNo = confirmNo.cloneNode(true);
  confirmYes.parentNode.replaceChild(newYes, confirmYes);
  confirmNo.parentNode.replaceChild(newNo, confirmNo);

  newYes.addEventListener("click", () => {
    modal.classList.remove("visible");
    onYes();
  });

  newNo.addEventListener("click", () => {
    modal.classList.remove("visible");
  });
}

// ============ SUBMIT BUTTON ============
document.getElementById("submitBtn").addEventListener("click", () => {
  if (answered < count) {
    showConfirm(
      `Vous avez répondu à ${answered} sur ${count} questions. Voulez-vous terminer le test ?`,
      showFinalResult
    );
  } else {
    showFinalResult();
  }
});

    const scrollBtn = document.getElementById("scrollTopBtn");

    window.addEventListener("scroll", () => {
      if (window.scrollY > 300) {
        scrollBtn.classList.add("visible");
      } else {
        scrollBtn.classList.remove("visible");
      }
    });

    scrollBtn.addEventListener("click", () => {
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  </script>
